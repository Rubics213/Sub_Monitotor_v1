description: >-
  Citymesh RVDP recon preset (BBOT). Scope and blacklist are generated by
  bbot_monitor.py; this preset only fixes module selection, rate caps and
  output modules.
flags:
  - subdomain-enum
require_flags:
  - passive
exclude_modules:
  # Active/intrusive: default credentials, brute force, fuzzing, exploitation.
  - nuclei
  - lightfuzz
  - medusa
  - legba
  - telerik
  - dotnetnuke
  - waf_bypass
  - bypass403
  - generic_ssrf
  - baddns
  - baddns_direct
  - baddns_zone
  - portscan
  - webbrute
  - webbrute_shortnames
  - paramminer_cookies
  - paramminer_getparams
  - paramminer_headers
  - iis_shortnames
  - hunt
  # DNS brute force. `require_flags: passive` already prevents this, but the
  # exclusion is repeated so a flag edit cannot silently turn it back on.
  - dnsbrute
  - dnsbrute_mutations
  # Outbound downloads / third-party API pulls that add noise or latency.
  - postman_download
  - docker_pull
  - filedownload
  - apkpure
  - google_playstore
  - jadx
  - gowitness
config:
  # Program cap is 20 req/s; run at 15 to leave headroom.
  web:
    http_rate_limit: 15
    http_timeout: 10
    http_retries: 1
    spider_depth: 1
    spider_distance: 0
    spider_links_per_page: 25
  dns:
    threads: 15
    brute_threads: 50
  scope:
    search_distance: 0
    report_distance: 0
  deps:
    behavior: ignore_failed
output_modules:
  - subdomains
  - json
  - asset_inventory
  - txt
