name: Subdomain Monitor - Citymesh

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run smoke test only (Discord + AI triage check, no scanning)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: citymesh-monitor
  cancel-in-progress: false

jobs:
  smoke_test:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_test == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      COHERE_API_KEY_2: ${{ secrets.COHERE_API_KEY_2 }}
      COHERE_API_KEY_3: ${{ secrets.COHERE_API_KEY_3 }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Test Discord webhook
        run: |
          CONTENT="Smoke test: Discord webhook is reachable. $(date -u '+%Y-%m-%d %H:%M UTC')"
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL")
          echo "Discord response code: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Discord webhook returned $HTTP_CODE — check DISCORD_WEBHOOK_URL secret"
            exit 1
          fi

      - name: Test AI triage pipeline (multi-key rotation, Gemini -> Cohere fallback)
        run: |
          chmod +x scripts/ai_call.py
          PROMPT_TEXT="Reply with exactly one short sentence confirming you received this test message."
          AI_RESULT=$(python3 scripts/ai_call.py "$PROMPT_TEXT" /tmp/smoke_summary.txt)
          PROVIDER=$(echo "$AI_RESULT" | grep -oP 'PROVIDER:\K.*' || echo "none")
          SUMMARY=$(cat /tmp/smoke_summary.txt 2>/dev/null || echo "")

          if [ -z "$SUMMARY" ]; then
            SUMMARY="AI triage FAILED — every configured Gemini and Cohere key failed. Check API keys and provider status."
            PROVIDER="none"
          fi

          CONTENT=$(printf "Smoke test — AI triage via **%s**:\n\`\`\`\n%s\n\`\`\`" "$PROVIDER" "$SUMMARY")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

          echo "SMOKE_PROVIDER=$PROVIDER" >> "$GITHUB_ENV"
          echo "SMOKE_SUMMARY=$SUMMARY" >> "$GITHUB_ENV"

      - name: Write smoke test summary
        if: always()
        run: |
          {
            echo "## Smoke Test Results"
            echo ""
            echo "Run time: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "- Discord webhook: reachable (see step above for status code)"
            echo "- AI triage provider that responded: **${SMOKE_PROVIDER:-unknown}**"
            echo ""
            echo "AI response:"
            echo '```'
            echo "${SMOKE_SUMMARY:-no response captured}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  monitor:
    if: github.event_name != 'workflow_dispatch' || inputs.smoke_test != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # environment: production   # uncomment + set name if webhook is an Environment secret
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go security binaries
        id: cache-go-bin
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-bin-v1

      - name: Install subfinder, httpx, nuclei, ffuf and katana
        if: steps.cache-go-bin.outputs.cache-hit != 'true'
        run: |
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install -v github.com/ffuf/ffuf/v2@latest
          go install -v github.com/projectdiscovery/katana/cmd/katana@latest

      - name: Add Go binaries to PATH
        run: echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Make shared scripts executable
        run: chmod +x scripts/ai_call.py

      - name: Download wordlist for directory bruteforce
        run: |
          mkdir -p wordlists
          curl -s -o wordlists/common.txt \
            https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt

      - name: Write subfinder provider config
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          CENSYS_API_ID: ${{ secrets.CENSYS_API_ID }}
          CENSYS_API_SECRET: ${{ secrets.CENSYS_API_SECRET }}
          ZOOMEYE_API_KEY: ${{ secrets.ZOOMEYE_API_KEY }}
          FOFA_EMAIL: ${{ secrets.FOFA_EMAIL }}
          FOFA_KEY: ${{ secrets.FOFA_KEY }}
          NETLAS_API_KEY: ${{ secrets.NETLAS_API_KEY }}
          LEAKIX_API_KEY: ${{ secrets.LEAKIX_API_KEY }}
          CRIMINALIP_API_KEY: ${{ secrets.CRIMINALIP_API_KEY }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          mkdir -p "$HOME/.config/subfinder"
          cat > "$HOME/.config/subfinder/provider-config.yaml" <<EOF
          shodan:
            - $SHODAN_API_KEY
          censys:
            - $CENSYS_API_ID:$CENSYS_API_SECRET
          zoomeye:
            - $ZOOMEYE_API_KEY
          fofa:
            - $FOFA_EMAIL:$FOFA_KEY
          netlas:
            - $NETLAS_API_KEY
          leakix:
            - $LEAKIX_API_KEY
          criminalip:
            - $CRIMINALIP_API_KEY
          virustotal:
            - $VIRUSTOTAL_API_KEY
          EOF

      - name: Run subdomain enumeration across all targets
        run: |
          mkdir -p results
          # Single multi-domain invocation instead of looping subfinder once per
          # domain — each separate invocation pays its own source-connection
          # startup cost (~5-15s), so 41 domains looped serially adds up fast.
          # subfinder's -dL handles internal concurrency across all of them at once.
          subfinder -dL targets.txt -silent -all -o results/current_raw.txt || touch results/current_raw.txt
          sort -u results/current_raw.txt -o results/current_raw.txt

      - name: Filter out-of-scope subdomains
        run: |
          if [ -s excluded.txt ]; then
            grep -v -F -f excluded.txt results/current_raw.txt > results/current.txt || true
          else
            cp results/current_raw.txt results/current.txt
          fi
          sort -u results/current.txt -o results/current.txt

      - name: Probe for live hosts with httpx
        run: |
          # rate-limit kept under Citymesh's 20 req/sec cap
          # -tech-detect fingerprints the stack so nuclei can use targeted tags
          #   rather than running the full template set against every host.
          httpx -l results/current.txt -silent -status-code -title \
                -tech-detect \
                -follow-redirects \
                -rate-limit 15 \
                -o results/current_alive.txt || touch results/current_alive.txt
          sort -u results/current_alive.txt -o results/current_alive.txt

          # Extract hostname-only column (first field) for diffing
          awk '{print $1}' results/current_alive.txt | sort -u > results/current_alive_hosts.txt

      - name: Diff against previous alive hosts
        id: diff
        run: |
          if [ -f results/previous_alive_hosts.txt ]; then
            comm -13 results/previous_alive_hosts.txt results/current_alive_hosts.txt > results/new_hosts.txt
          else
            cp results/current_alive_hosts.txt results/new_hosts.txt
          fi

          NEW_COUNT=$(wc -l < results/new_hosts.txt | tr -d ' ')
          echo "new_count=$NEW_COUNT" >> "$GITHUB_OUTPUT"

          # Pull full detail lines (with status/title) for only the new hosts
          if [ -s results/new_hosts.txt ]; then
            grep -F -f results/new_hosts.txt results/current_alive.txt > results/new_detail.txt
          else
            touch results/new_detail.txt
          fi

      - name: Notify Discord if new live subdomains found
        if: steps.diff.outputs.new_count != '0'
        run: |
          NEW_SUBS=$(cat results/new_detail.txt)
          CONTENT=$(printf "**New live subdomains found for Citymesh:**\n\`\`\`\n%s\n\`\`\`" "$NEW_SUBS")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Compute today's date for cache key
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache nuclei templates (refresh at most once/day)
        id: cache-nuclei-templates
        uses: actions/cache@v4
        with:
          path: ~/.config/nuclei
          key: nuclei-templates-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            nuclei-templates-${{ runner.os }}-

      - name: Update nuclei templates (only on cache miss)
        if: steps.cache-nuclei-templates.outputs.cache-hit != 'true'
        run: nuclei -update-templates -silent || true

      - name: Scan live hosts with nuclei (per-host tech targeting)
        run: |
          # Per-host tech targeting: instead of unioning every detected tech
          # across every host and running nuclei once with a giant tag list
          # (which meant IIS templates ran against PHP hosts and vice versa),
          # group hosts by their tech signature and run nuclei once per group
          # with only that group's relevant tech tags.
          #
          # Expected impact:
          #   - Fewer irrelevant templates evaluated per host -> faster, less
          #     log noise from templates that can't possibly match.
          #   - Groups run sequentially, so each keeps its own -rate-limit 15
          #     and the combined request rate stays under Citymesh's 20/sec cap.
          #   - Cost: N nuclei invocations instead of 1, each with ~5-15s of
          #     template-loading overhead. For 5-10 unique tech signatures on
          #     the Citymesh target set this is well under a minute extra.
          #
          # Hosts that httpx couldn't fingerprint land in a single "_BASE_"
          # group that gets the base tags only — same as the old behaviour
          # for undetected hosts.

          BASE_TAGS="exposures,misconfiguration,takeovers,default-logins,cves"
          GROUPS_DIR="results/nuclei_groups"
          mkdir -p "$GROUPS_DIR"
          rm -f "$GROUPS_DIR"/*

          python3 - << 'PYEOF'
          import os
          import re

          BASE_TAGS = "exposures,misconfiguration,takeovers,default-logins,cves"

          KNOWN_TECHS = {
              "php", "wordpress", "laravel", "drupal", "joomla", "jquery",
              "vue", "react", "angular", "iis", "nginx", "apache", "tomcat",
              "spring", "django", "ruby", "asp.net",
          }
          TECH_ALIASES = {"aspnet": "asp.net"}

          BRACKET_RE = re.compile(r"\[([^\]]*)\]")

          GROUPS_DIR = "results/nuclei_groups"
          os.makedirs(GROUPS_DIR, exist_ok=True)

          groups = {}
          total_lines = 0
          parsed_with_tech = 0

          with open("results/current_alive.txt") as fh:
              for line in fh:
                  line = line.rstrip("\n")
                  if not line.strip():
                      continue
                  total_lines += 1
                  host = line.split()[0]

                  techs = []
                  for b in reversed(BRACKET_RE.findall(line)):
                      parts = [p.strip() for p in b.split(",") if p.strip()]
                      if not parts:
                          continue
                      matched = []
                      for p in parts:
                          name = p.split(":")[0].strip().lower()
                          name = TECH_ALIASES.get(name, name)
                          if name in KNOWN_TECHS:
                              matched.append(name)
                      if matched and len(matched) == len(parts):
                          techs = sorted(set(matched))
                          break

                  if techs:
                      parsed_with_tech += 1

                  key = ",".join(techs) if techs else "_BASE_"
                  entry = groups.setdefault(key, {"techs": techs, "hosts": []})
                  entry["hosts"].append(host)

          def sort_key(item):
              key = item[0]
              return (key != "_BASE_", key)

          group_list = sorted(groups.items(), key=sort_key)
          for i, (key, entry) in enumerate(group_list):
              prefix = f"{GROUPS_DIR}/group_{i:02d}"
              with open(f"{prefix}_hosts.txt", "w") as fh:
                  fh.write("\n".join(entry["hosts"]) + "\n")
              tags = BASE_TAGS + ("," + ",".join(entry["techs"]) if entry["techs"] else "")
              with open(f"{prefix}_tags.txt", "w") as fh:
                  fh.write(tags)

          print(f"Parsed {total_lines} live host lines ({parsed_with_tech} with tech detected)")
          print(f"Nuclei will run in {len(group_list)} group(s):")
          for i, (key, entry) in enumerate(group_list):
              label = ",".join(entry["techs"]) if entry["techs"] else "base tags only"
              print(f"  Group {i:02d}: {len(entry['hosts']):3d} hosts — {label}")
          PYEOF

          > results/nuclei_current.txt
          for tags_file in "$GROUPS_DIR"/group_*_tags.txt; do
            [ -f "$tags_file" ] || continue
            prefix="${tags_file%_tags.txt}"
            hosts_file="${prefix}_hosts.txt"
            out_file="${prefix}_out.txt"

            tags=$(cat "$tags_file")
            host_count=$(wc -l < "$hosts_file" | tr -d ' ')
            echo "── Running nuclei: $host_count host(s), tags: $tags"

            nuclei -l "$hosts_file" \
                   -tags "$tags" \
                   -severity low,medium,high,critical \
                   -rate-limit 15 \
                   -silent \
                   -o "$out_file" || touch "$out_file"

            cat "$out_file" >> results/nuclei_current.txt 2>/dev/null || true
          done
          sort -u results/nuclei_current.txt -o results/nuclei_current.txt
          echo "Total nuclei findings this run: $(wc -l < results/nuclei_current.txt | tr -d ' ')"

      - name: Diff nuclei findings against previous run
        id: nuclei_diff
        run: |
          if [ -f results/nuclei_previous.txt ]; then
            comm -13 results/nuclei_previous.txt results/nuclei_current.txt > results/nuclei_new.txt
          else
            cp results/nuclei_current.txt results/nuclei_new.txt
          fi

          NEW_FINDINGS=$(wc -l < results/nuclei_new.txt | tr -d ' ')
          echo "new_findings=$NEW_FINDINGS" >> "$GITHUB_OUTPUT"

      - name: AI-triage new nuclei findings
        id: triage
        if: steps.nuclei_diff.outputs.new_findings != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_API_KEY_2: ${{ secrets.COHERE_API_KEY_2 }}
          COHERE_API_KEY_3: ${{ secrets.COHERE_API_KEY_3 }}
        run: |
          FINDINGS=$(cat results/nuclei_new.txt)
          INSTRUCTIONS="You are triaging bug bounty / responsible-disclosure scan output for the Citymesh program (no bounty, points/reputation only). Below is nuclei output listing NEW findings from this scan cycle. For each finding, briefly note what it is and whether it looks worth manual follow-up. Group by severity (critical/high first). Flag anything that overlaps with Citymesh's excluded finding categories (e.g. missing headers, verbose errors without sensitive data, CSRF with low impact, disclosed API keys without proven business impact) as LOW PRIORITY / likely not reportable. End with a short list of the top 3 findings worth investigating manually first, or state clearly if nothing looks worth pursuing. Be concise, plain text, no markdown headers."
          PROMPT_TEXT=$(printf "%s\n\nFINDINGS:\n%s" "$INSTRUCTIONS" "$FINDINGS")

          AI_RESULT=$(python3 scripts/ai_call.py "$PROMPT_TEXT" results/ai_summary.txt)
          PROVIDER=$(echo "$AI_RESULT" | grep -oP 'PROVIDER:\K.*' || echo "none")
          echo "AI triage provider used: $PROVIDER"

          if [ ! -s results/ai_summary.txt ]; then
            printf "AI triage unavailable this run — raw findings:\n%s" "$(head -c 1200 results/nuclei_new.txt)" > results/ai_summary.txt
          fi

      - name: Notify Discord if new nuclei findings
        if: steps.nuclei_diff.outputs.new_findings != '0'
        run: |
          SUMMARY=$(head -c 1700 results/ai_summary.txt)
          CONTENT=$(printf "**New nuclei findings for Citymesh (AI-triaged):**\n\`\`\`\n%s\n\`\`\`" "$SUMMARY")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: AI-prioritize hosts worth fuzzing
        id: prioritize
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_API_KEY_2: ${{ secrets.COHERE_API_KEY_2 }}
          COHERE_API_KEY_3: ${{ secrets.COHERE_API_KEY_3 }}
        run: |
          HOSTS_INFO=$(head -n 150 results/current_alive.txt)
          TOTAL_HOSTS=$(wc -l < results/current_alive_hosts.txt | tr -d ' ')

          INSTRUCTIONS="You are prioritizing which live hosts are worth deep directory bruteforcing in a responsible-disclosure recon pipeline. Below is a list of live hosts with their HTTP status code and page title, one per line. Pick the hosts most likely to be real applications, admin panels, APIs, portals, or dashboards worth fuzzing for hidden paths — favor hostnames like auth., api., admin., portal., my., dashboard., app., cabmanager., gateway. Deprioritize and EXCLUDE hosts that look like static marketing pages, CDN/asset hosts, parked domains, pure redirects with no distinct title, or anything clearly not an application. Return ONLY the full URLs to fuzz, one per line, nothing else — no numbering, no explanation, no markdown. Return at most 20 URLs, chosen by likely value."
          PROMPT_TEXT=$(printf "%s\n\nHOSTS:\n%s" "$INSTRUCTIONS" "$HOSTS_INFO")

          AI_RESULT=$(python3 scripts/ai_call.py "$PROMPT_TEXT" /tmp/ai_fuzz_hosts.txt)
          PROVIDER=$(echo "$AI_RESULT" | grep -oP 'PROVIDER:\K.*' || echo "none")
          echo "Prioritization provider: $PROVIDER"

          grep -E '^https?://' /tmp/ai_fuzz_hosts.txt 2>/dev/null | sort -u > results/ffuf_targets.txt || true

          FILTERED_COUNT=$(wc -l < results/ffuf_targets.txt | tr -d ' ')
          if [ "$FILTERED_COUNT" = "0" ]; then
            echo "AI prioritization returned nothing usable — falling back to first 15 live hosts"
            head -n 15 results/current_alive_hosts.txt > results/ffuf_targets.txt
            echo "prioritized=false" >> "$GITHUB_OUTPUT"
          else
            echo "prioritized=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Fuzzing $(wc -l < results/ffuf_targets.txt | tr -d ' ') of $TOTAL_HOSTS live hosts"

      - name: Directory bruteforce with ffuf
        run: |
          mkdir -p results/ffuf_tmp
          rm -f results/ffuf_tmp/*

          python3 - << 'PYEOF'
          import json
          import urllib.request
          import urllib.error

          def get_canary_signature(base_url):
              base_url = base_url.rstrip("/")
              canary_url = base_url + "/___canary_path_that_cannot_exist_xyz123___"
              try:
                  req = urllib.request.Request(canary_url,
                        headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=8) as r:
                      body = r.read()
                      return r.status, len(body)
              except urllib.error.HTTPError as e:
                  return e.code, 0
              except Exception:
                  return None, 0

          sigs = {}
          with open("results/ffuf_targets.txt") as f:
              for line in f:
                  host = line.strip().rstrip("/")
                  if not host:
                      continue
                  status, length = get_canary_signature(host)
                  sigs[host] = {"status": status, "length": length}

          with open("results/canary_signatures.json", "w") as out:
              json.dump(sigs, out, indent=2)

          print(f"Canary signatures captured for {len(sigs)} hosts:")
          for h, s in sigs.items():
              flag = "  <- CATCH-ALL" if s["status"] == 200 and s["length"] > 0 else ""
              print(f"  {h} -> status={s['status']} length={s['length']}{flag}")
          PYEOF

          cat results/ffuf_targets.txt | xargs -P 4 -I{} bash -c '
            host="$1"
            [ -z "$host" ] && exit 0
            safe_name=$(echo "$host" | sha1sum | cut -d" " -f1)
            ffuf -u "${host}/FUZZ" \
                 -w wordlists/common.txt \
                 -mc 200,201,202,204,301,302,307,401,403 \
                 -ac \
                 -rate 4 \
                 -t 15 \
                 -timeout 8 \
                 -o "results/ffuf_tmp/${safe_name}.json" \
                 -of json \
              > /dev/null 2>&1 || true
          ' _ {}

          python3 - << 'PYEOF'
          import glob
          import json
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          with open("results/canary_signatures.json") as f:
              canaries = json.load(f)

          WORDLIST_SIZE = sum(1 for _ in open("wordlists/common.txt"))
          THRESHOLD = WORDLIST_SIZE * 60 // 100

          NOISE_RE = re.compile(
              r"/(favicon\.ico|robots\.txt|\.well-known/(http-opportunistic|acme-challenge|pki-validation))( |\[|$)"
          )

          SENSITIVE_PATHS = {
              "web.config":  ["connectionString", "password", "apiKey", "secret", "credentials"],
              ".env":        ["DB_PASSWORD", "SECRET_KEY", "API_KEY", "TOKEN", "AWS_"],
              ".git/HEAD":   ["ref: refs/", "HEAD detached"],
              ".git/config": ["[core]", "[remote", "url ="],
              ".htpasswd":   [":"],
              "config.php":  ["$db_pass", "$password", "mysql_connect"],
              ".bash_history": ["cd ", "ls ", "cat ", "export ", "sudo ", "apt ", "git "],
              ".bashrc":       ["export ", "alias ", "PATH=", "PS1=", "source "],
              ".profile":      ["export ", "PATH=", "umask", "source ", "if ["],
              ".ssh":          ["ssh-rsa", "ssh-ed25519", "authorized_keys", "known_hosts"],
              ".passwd":       ["root:", "nologin", "/bin/bash", "/bin/sh"],
              ".mysql_history": ["SELECT ", "INSERT ", "UPDATE ", "CREATE ", "DROP "],
              ".htaccess":     ["RewriteRule", "RewriteCond", "Deny from", "Allow from", "Order"],
              ".svn":          ["svn:", "format", "entries", "wc.db"],
              ".cvs":          ["CVS", "Root", "Repository", "Entries"],
              "access_log":    ["GET /", "POST /", "HTTP/1.", "Mozilla/", "200 ", "404 "],
          }

          UA = "Mozilla/5.0"
          FETCH_TIMEOUT = 8
          FETCH_DELAY = 0.15
          MAX_FETCHES = 300


          def is_catchall_response(status, body_len, canary_status, canary_len):
              if canary_status != 200:
                  return False
              if canary_len == 0:
                  return False
              return abs(body_len - canary_len) / canary_len < 0.05


          def fetch_body(url, timeout=FETCH_TIMEOUT):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA})
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.read(8192).decode("utf-8", "ignore")
              except urllib.error.HTTPError as e:
                  try:
                      return e.read(8192).decode("utf-8", "ignore") if e.fp else ""
                  except Exception:
                      return ""
              except Exception:
                  return ""


          def validate_sensitive_content(url, body_text):
              path = urllib.parse.urlparse(url).path.lstrip("/")
              for sensitive_path, keywords in SENSITIVE_PATHS.items():
                  if path.endswith(sensitive_path):
                      return any(kw in body_text for kw in keywords)
              return True


          def is_sensitive_path(url):
              path = urllib.parse.urlparse(url).path.lstrip("/")
              return any(path.endswith(sp) for sp in SENSITIVE_PATHS)


          current_raw = []
          suspects = []
          seen = set()
          stats = {
              "total": 0,
              "filtered_canary": 0,
              "filtered_noise": 0,
              "sensitive_checked": 0,
              "sensitive_dropped": 0,
              "fetches": 0,
              "hosts": 0,
              "catchall_hosts": 0,
          }

          for path in sorted(glob.glob("results/ffuf_tmp/*.json")):
              try:
                  with open(path) as f:
                      data = json.load(f)
              except Exception:
                  continue

              stats["hosts"] += 1
              host_url = (data.get("config", {}).get("url") or "").replace("/FUZZ", "").rstrip("/")
              results = data.get("results", []) or []
              count = len(results)
              stats["total"] += count

              canary = canaries.get(host_url, {"status": None, "length": 0})
              canary_status = canary.get("status")
              canary_len = canary.get("length", 0)
              if canary_status == 200 and canary_len > 0:
                  stats["catchall_hosts"] += 1

              if count > THRESHOLD:
                  suspects.append(
                      f"{host_url} — {count}/{WORDLIST_SIZE} matched "
                      f"(likely catch-all, canary check below)"
                  )

              for r in results:
                  url = r.get("url", "")
                  status = r.get("status", 0)
                  length = r.get("length", 0)
                  redirect = r.get("redirectlocation", "") or ""

                  if is_catchall_response(status, length, canary_status, canary_len):
                      stats["filtered_canary"] += 1
                      continue

                  if status in (301, 302) and redirect:
                      line = f"{url} [{status}] -> {redirect}"
                  else:
                      line = f"{url} [{status}]"

                  if NOISE_RE.search(line):
                      stats["filtered_noise"] += 1
                      continue

                  if 200 <= status < 300 and is_sensitive_path(url):
                      stats["sensitive_checked"] += 1
                      if stats["fetches"] < MAX_FETCHES:
                          body = fetch_body(url)
                          stats["fetches"] += 1
                          time.sleep(FETCH_DELAY)
                          if not validate_sensitive_content(url, body):
                              stats["sensitive_dropped"] += 1
                              continue
                      else:
                          line = f"{line} [sensitive-unverified: fetch cap reached]"

                  if line not in seen:
                      seen.add(line)
                      current_raw.append(line)

          ordered = sorted(current_raw)
          payload = "\n".join(ordered) + ("\n" if ordered else "")

          with open("results/ffuf_current.txt", "w") as out:
              out.write(payload)
          with open("results/ffuf_suspect_hosts.txt", "w") as out:
              out.write("\n".join(suspects) + ("\n" if suspects else ""))

          print(f"Hosts fuzzed: {stats['hosts']}")
          print(f"Hosts whose canary was itself a 200 (catch-all behaviour): {stats['catchall_hosts']}")
          print(f"Raw hits: {stats['total']}")
          print(f"Dropped by canary filter (within 5% of canary length): {stats['filtered_canary']}")
          print(f"Dropped by noise filter: {stats['filtered_noise']}")
          print(f"Sensitive-path 2xx responses checked for content: {stats['sensitive_checked']}")
          print(f"  -> dropped as empty/stub (no expected markers found): {stats['sensitive_dropped']}")
          print(f"  -> validation fetches performed: {stats['fetches']} (cap {MAX_FETCHES})")
          print(f"Kept after all filters: {len(ordered)}")
          if suspects:
              print("Suspect catch-all hosts (over 60% wordlist match):")
              for s in suspects:
                  print(f"  {s}")
          PYEOF

      - name: Diff ffuf findings against previous run
        id: ffuf_diff
        run: |
          if [ -f results/ffuf_previous.txt ]; then
            comm -13 results/ffuf_previous.txt results/ffuf_current.txt > results/ffuf_new.txt
          else
            cp results/ffuf_current.txt results/ffuf_new.txt
          fi
          NEW_PATHS=$(wc -l < results/ffuf_new.txt | tr -d ' ')
          echo "new_paths=$NEW_PATHS" >> "$GITHUB_OUTPUT"

      - name: Capture server headers for confirmed findings (delta, every run)
        if: steps.ffuf_diff.outputs.new_paths != '0'
        run: |
          > results/findings_with_headers.txt
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            url=$(echo "$line" | awk '{print $1}')
            echo "=== $url ===" >> results/findings_with_headers.txt
            curl -sI --max-time 8 "$url" | grep -iE \
              "server:|x-powered-by:|x-aspnet-version:|x-generator:|via:|x-backend:" \
              >> results/findings_with_headers.txt 2>/dev/null || true
            echo "$line" >> results/findings_with_headers.txt
            echo "" >> results/findings_with_headers.txt
          done < results/ffuf_new.txt

      - name: Capture server headers for full backlog (weekly Sunday 00:00 UTC, or manual test dispatch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — bypassing weekly day/hour guard (test mode)"
          else
            DAY=$(date -u +%u)
            HOUR=$((10#$(date -u +%H)))
            if [ "$DAY" != "7" ] || [ "$HOUR" -gt 2 ]; then
              echo "Not the weekly slot (Sunday 00:00 UTC) — skipping full-backlog header capture"
              exit 0
            fi
            echo "Weekly slot confirmed — running full-backlog header capture"
          fi

          if [ ! -s results/ffuf_current.txt ]; then
            echo "No confirmed ffuf findings to capture headers for"
            touch results/findings_with_headers_full.txt
            exit 0
          fi

          > results/findings_with_headers_full.txt
          TOTAL=$(wc -l < results/ffuf_current.txt | tr -d ' ')
          echo "Capturing headers for all $TOTAL confirmed findings..."
          COUNT=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            COUNT=$((COUNT+1))
            url=$(echo "$line" | awk '{print $1}')
            echo "=== $url ===" >> results/findings_with_headers_full.txt
            curl -sI --max-time 8 "$url" | grep -iE \
              "server:|x-powered-by:|x-aspnet-version:|x-generator:|via:|x-backend:" \
              >> results/findings_with_headers_full.txt 2>/dev/null || true
            echo "$line" >> results/findings_with_headers_full.txt
            echo "" >> results/findings_with_headers_full.txt
          done < results/ffuf_current.txt

          echo "Full-backlog header capture complete: $COUNT findings, $(wc -l < results/findings_with_headers_full.txt) lines written"

      - name: AI-triage ffuf and bypass findings
        id: ffuf_triage
        if: steps.ffuf_diff.outputs.new_paths != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_API_KEY_2: ${{ secrets.COHERE_API_KEY_2 }}
          COHERE_API_KEY_3: ${{ secrets.COHERE_API_KEY_3 }}
        run: |
          FINDINGS=$(head -n 80 results/ffuf_new.txt)
          INSTRUCTIONS="You are triaging raw ffuf directory bruteforce results for the Citymesh responsible-disclosure program. Each line is 'url [status_code]'. Separate into:\nPRIORITY (manually verify immediately): .git/, .env, web.config, .htpasswd, phpMyAdmin (pma), admin panels, backup files (.bak/.old/.zip/.sql), API endpoints returning 200, exposed config files, management interfaces.\nINVESTIGATE: health endpoints, vendor/, cgi-bin/, staging subdomains, 401/403 paths suggesting auth-gated content.\nNOISE (skip): favicon.ico, .well-known/* (acme-challenge, pki-validation, http-opportunistic), /blocked, /maintenance, /assets returning 301, static files on CDN hosts.\nALSO FLAG: 301 redirects on sensitive paths (follow manually) and case-manipulation bypass results needing body verification.\nBe concise. Plain text. End with TOP PRIORITY: listing the 1-3 URLs to curl manually first."
          PROMPT_TEXT=$(printf "%s\n\nFINDINGS:\n%s" "$INSTRUCTIONS" "$FINDINGS")

          AI_RESULT=$(python3 scripts/ai_call.py "$PROMPT_TEXT" results/ffuf_ai_summary.txt)
          PROVIDER=$(echo "$AI_RESULT" | grep -oP 'PROVIDER:\K.*' || echo "none")

          if [ ! -s results/ffuf_ai_summary.txt ]; then
            printf "AI unavailable — raw findings:\n%s" "$FINDINGS" > results/ffuf_ai_summary.txt
          fi

          echo "triage_provider=$PROVIDER" >> "$GITHUB_OUTPUT"

      - name: Notify Discord if new paths found
        if: steps.ffuf_diff.outputs.new_paths != '0'
        run: |
          SUMMARY=$(head -c 1700 results/ffuf_ai_summary.txt)
          CONTENT=$(printf "**New ffuf findings — AI-triaged (Citymesh):**\n\`\`\`\n%s\n\`\`\`" "$SUMMARY")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord if any host looks like a soft-404 false-positive source
        if: hashFiles('results/ffuf_suspect_hosts.txt') != ''
        run: |
          if [ -s results/ffuf_suspect_hosts.txt ]; then
            SUSPECTS=$(cat results/ffuf_suspect_hosts.txt)
            CONTENT=$(printf "**Warning: possible soft-404 false positives (Citymesh ffuf run):**\nThese hosts matched over 60%% of the wordlist — likely a catch-all page, not real paths. Treat their findings as unreliable until manually checked.\n\`\`\`\n%s\n\`\`\`" "$SUSPECTS")
            PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
            curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
          fi

      - name: Attempt 403 bypass on restricted paths found
        run: |
          # Only probes paths ffuf already flagged as 401/403 — not a new broad
          # scan. Read-only techniques only (see original design notes below).
          #
          # Parallelized across hosts (xargs -P 4) to keep this step's
          # wall-clock time down — it used to run fully sequentially with a
          # 0.3s delay per request, which added up to several minutes for 20
          # hosts x ~17 variants each. Each worker keeps its own per-request
          # delay, so the combined external request rate still stays well
          # under Citymesh's cap because ffuf and nuclei have already
          # finished by this point in the job.
          cat > bypass_check.py << 'PYEOF'
          import urllib.request, urllib.error, http.client, urllib.parse, time, json, sys

          TIMEOUT = 8
          DELAY = 0.3
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

          SAFE_METHODS = ["OPTIONS", "HEAD", "TRACE", "PROPFIND", "SEARCH"]


          class _NoRedirectSimple(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          _no_redirect_simple = urllib.request.build_opener(_NoRedirectSimple)


          def request_status(url, method="GET", headers=None, timeout=TIMEOUT):
              hdrs = {"User-Agent": UA}
              if headers:
                  hdrs.update(headers)
              try:
                  req = urllib.request.Request(url, method=method, headers=hdrs)
                  with _no_redirect_simple.open(req, timeout=timeout) as r:
                      return r.status
              except urllib.error.HTTPError as e:
                  return e.code
              except Exception:
                  return None


          def http10_status(url, timeout=TIMEOUT):
              try:
                  parsed = urllib.parse.urlparse(url)
                  conn_cls = http.client.HTTPSConnection if parsed.scheme == "https" else http.client.HTTPConnection
                  port = parsed.port or (443 if parsed.scheme == "https" else 80)
                  conn = conn_cls(parsed.hostname, port, timeout=timeout)
                  conn._http_vsn = 10
                  conn._http_vsn_str = "HTTP/1.0"
                  path = parsed.path or "/"
                  if parsed.query:
                      path += "?" + parsed.query
                  conn.request("GET", path, headers={"User-Agent": UA, "Host": parsed.hostname})
                  resp = conn.getresponse()
                  status = resp.status
                  conn.close()
                  return status
              except Exception:
                  return None


          def wayback_snapshot(url):
              try:
                  api = "https://archive.org/wayback/available?url=" + urllib.parse.quote(url, safe="")
                  req = urllib.request.Request(api, headers={"User-Agent": UA})
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                      data = json.loads(r.read().decode("utf-8", "ignore"))
                  snap = (data.get("archived_snapshots") or {}).get("closest")
                  if snap and snap.get("available"):
                      return snap.get("url")
              except Exception:
                  pass
              return None


          def split_url(url):
              scheme_sep = url.find("://") + 3
              host_end = url.find("/", scheme_sep)
              if host_end == -1:
                  return url, "/"
              return url[:host_end], url[host_end:]


          def build_path_variants(url):
              base, path = split_url(url)
              if not path.startswith("/"):
                  path = "/" + path
              trimmed = path.rstrip("/")
              last_seg = trimmed.rsplit("/", 1)[-1] if trimmed else ""
              parent = trimmed[: -len(last_seg)] if last_seg else trimmed

              variants = [
                  path + "/",
                  path.rstrip("/"),
                  trimmed + ".",
                  trimmed + "%20",
                  trimmed + "%2e",
                  "/%2e%2e" + trimmed,
                  "/%2e%2e%2f" + last_seg if last_seg else path,
                  "/%2e%2e/%2e%2e" + trimmed,
                  trimmed + "%2f",
                  trimmed.replace("/", "//", 1),
                  trimmed + "%252f",
                  parent + "..;/" + last_seg if last_seg else path,
                  "/..;" + trimmed,
                  trimmed + "%c0%af",
                  trimmed + "%ef%bc%8f",
                  trimmed + "%00.html",
                  trimmed + "%00.json",
              ]

              for ext in [".json", ".html", ".php", ".bak", ".old"]:
                  variants.append(trimmed + ext)

              if last_seg:
                  for cased in {last_seg.upper(), last_seg.lower(), last_seg.swapcase()}:
                      if cased != last_seg:
                          variants.append(parent + cased)

              for param in ["unused_param=1", "debug=true", "access=granted", "redirect=allowed"]:
                  variants.append(path + "?" + param)

              seen = set()
              out = []
              for v in variants:
                  full = base + v if not v.startswith("http") else v
                  if full not in seen:
                      seen.add(full)
                      out.append(full)
              return base, path, out


          def build_header_variants(url):
              _, path = split_url(url)
              return [
                  {"X-Original-URL": path},
                  {"X-Rewrite-URL": path},
                  {"X-Forwarded-For": "127.0.0.1"},
                  {"X-Forwarded-Host": "127.0.0.1"},
                  {"X-Custom-IP-Authorization": "127.0.0.1"},
                  {"X-Client-IP": "127.0.0.1"},
                  {"True-Client-IP": "127.0.0.1"},
                  {"X-Real-IP": "127.0.0.1"},
                  {"X-Host": "localhost"},
                  {"Referer": url},
              ]


          SENSITIVE_PATHS = {
              "web.config":  ["connectionString", "password", "apiKey", "secret", "credentials"],
              ".env":        ["DB_PASSWORD", "SECRET_KEY", "API_KEY", "TOKEN", "AWS_"],
              ".git/HEAD":   ["ref: refs/", "HEAD detached"],
              ".git/config": ["[core]", "[remote", "url ="],
              ".htpasswd":   [":"],
              "config.php":  ["$db_pass", "$password", "mysql_connect"],
              ".bash_history": ["cd ", "ls ", "cat ", "export ", "sudo ", "apt ", "git "],
              ".bashrc":       ["export ", "alias ", "PATH=", "PS1=", "source "],
              ".profile":      ["export ", "PATH=", "umask", "source ", "if ["],
              ".ssh":          ["ssh-rsa", "ssh-ed25519", "authorized_keys", "known_hosts"],
              ".passwd":       ["root:", "nologin", "/bin/bash", "/bin/sh"],
              ".mysql_history": ["SELECT ", "INSERT ", "UPDATE ", "CREATE ", "DROP "],
              ".htaccess":     ["RewriteRule", "RewriteCond", "Deny from", "Allow from", "Order"],
              ".svn":          ["svn:", "format", "entries", "wc.db"],
              ".cvs":          ["CVS", "Root", "Repository", "Entries"],
              "access_log":    ["GET /", "POST /", "HTTP/1.", "Mozilla/", "200 ", "404 "],
          }


          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          _no_redirect_opener = urllib.request.build_opener(_NoRedirect)


          def request_with_body(url, method="GET", headers=None, timeout=TIMEOUT):
              hdrs = {"User-Agent": UA}
              if headers:
                  hdrs.update(headers)
              try:
                  req = urllib.request.Request(url, method=method, headers=hdrs)
                  with _no_redirect_opener.open(req, timeout=timeout) as r:
                      ct = r.headers.get("Content-Type", "")
                      body = r.read(4096).decode("utf-8", "ignore")
                      return r.status, ct, body
              except urllib.error.HTTPError as e:
                  ct = e.headers.get("Content-Type", "") if e.headers else ""
                  body = e.read(4096).decode("utf-8", "ignore") if e.fp else ""
                  return e.code, ct, body
              except Exception:
                  return None, "", ""


          def validate_bypass_response(url, response_body, content_type):
              non_html_paths = [".gz", ".tar", ".zip", ".sql", ".bak", ".json", ".xml", ".env"]
              path = urllib.parse.urlparse(url).path.lower()
              if any(path.endswith(ext) for ext in non_html_paths):
                  if "text/html" in content_type:
                      return False

              spa_markers = [
                  "<div id=\"app\">",
                  "<div id=\"spinner\"",
                  "chunk-vendors",
                  "has-spinner-active",
              ]
              return not any(marker in response_body for marker in spa_markers)


          def validate_sensitive_content(url, body_text):
              path = urllib.parse.urlparse(url).path.lstrip("/")
              for sensitive_path, keywords in SENSITIVE_PATHS.items():
                  if path.endswith(sensitive_path):
                      return any(kw in body_text for kw in keywords)
              return True


          def is_real_bypass(bypass_url, original_url, status, content_type, body):
              login_markers = [
                  "/login?redirectTo=",
                  'action="/login"',
                  'href="/login"',
                  "<title>Login</title>",
                  "<title>Sign in</title>",
                  "name=\"password\"",
                  'id="login-form"',
              ]
              body_lower = body.lower()
              if any(m.lower() in body_lower for m in login_markers):
                  return False

              if not validate_bypass_response(bypass_url, body, content_type):
                  return False

              orig_path = urllib.parse.urlparse(original_url).path.lstrip("/")
              for sensitive_path in SENSITIVE_PATHS:
                  if orig_path.endswith(sensitive_path):
                      return validate_sensitive_content(original_url, body)

              return True


          def try_target(url):
              for hdrs in build_header_variants(url):
                  status, ct, body = request_with_body(url, method="GET", headers=hdrs)
                  time.sleep(DELAY)
                  if status and 200 <= status < 300:
                      if is_real_bypass(url, url, status, ct, body):
                          hdr_str = ", ".join(f"{k}: {v}" for k, v in hdrs.items())
                          return f"{url} -> bypass via header [{hdr_str}] returned {status}"

              base, path, variants = build_path_variants(url)
              for variant_url in variants:
                  status, ct, body = request_with_body(variant_url, method="GET")
                  time.sleep(DELAY)
                  if status and 200 <= status < 300:
                      if is_real_bypass(variant_url, url, status, ct, body):
                          return f"{url} -> bypass via path variant '{variant_url}' returned {status}"

              for method in SAFE_METHODS:
                  status, ct, body = request_with_body(url, method=method)
                  time.sleep(DELAY)
                  if status and 200 <= status < 300:
                      if is_real_bypass(url, url, status, ct, body):
                          return f"{url} -> bypass via method {method} returned {status}"

              if url.startswith("https://"):
                  http_url = "http://" + url[len("https://"):]
                  status, ct, body = request_with_body(http_url, method="GET")
                  time.sleep(DELAY)
                  if status and 200 <= status < 300:
                      if is_real_bypass(http_url, url, status, ct, body):
                          return f"{url} -> bypass via HTTP downgrade '{http_url}' returned {status}"

              code = http10_status(url)
              time.sleep(DELAY)
              if code and 200 <= code < 300:
                  return f"{url} -> bypass via HTTP/1.0 downgrade returned {code}"

              snap = wayback_snapshot(url)
              if snap:
                  return f"{url} -> historical snapshot available on Wayback Machine: {snap}"

              return None


          def main():
              # Operates on a single target URL passed on argv, so the shell
              # can fan this out with `xargs -P`. Falls back to processing
              # all targets serially if invoked with no argv (keeps the
              # script usable standalone / for debugging).
              if len(sys.argv) > 1:
                  result = try_target(sys.argv[1])
                  if result:
                      print(result)
                  return

              with open("results/ffuf_current.txt") as f:
                  lines = [l.strip() for l in f if l.strip()]

              targets = []
              for line in lines:
                  if line.endswith("[401]") or line.endswith("[403]"):
                      targets.append(line.rsplit(" [", 1)[0])
              targets = targets[:20]

              for url in targets:
                  result = try_target(url)
                  if result:
                      print(result)


          if __name__ == "__main__":
              main()
          PYEOF

          # Build the capped target list, then fan it out across 4 parallel
          # workers (one target URL per worker invocation) instead of one
          # long sequential loop.
          grep -E '\[401\]$|\[403\]$' results/ffuf_current.txt \
            | awk '{print $1}' \
            | head -n 20 > results/bypass_targets.txt

          cat results/bypass_targets.txt | xargs -P 4 -I{} python3 bypass_check.py {} \
            > results/bypass_current.txt 2>/dev/null || true

          sort -u results/bypass_current.txt -o results/bypass_current.txt 2>/dev/null || touch results/bypass_current.txt

      - name: Diff 403 bypass findings against previous run
        id: bypass_diff
        run: |
          if [ -f results/bypass_previous.txt ]; then
            comm -13 results/bypass_previous.txt results/bypass_current.txt > results/bypass_new.txt
          else
            cp results/bypass_current.txt results/bypass_new.txt
          fi
          NEW_BYPASSES=$(wc -l < results/bypass_new.txt | tr -d ' ')
          echo "new_bypasses=$NEW_BYPASSES" >> "$GITHUB_OUTPUT"

      - name: Notify Discord if new 403 bypass found
        if: steps.bypass_diff.outputs.new_bypasses != '0'
        run: |
          BYPASSES=$(head -c 1700 results/bypass_new.txt)
          CONTENT=$(printf "**403 bypass succeeded (Citymesh) — verify manually before reporting:**\n\`\`\`\n%s\n\`\`\`" "$BYPASSES")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Extract JS URLs from discovered pages + katana crawl
        run: |
          mkdir -p results

          jq -r '.results[]?.url // empty' results/ffuf_tmp/*.json 2>/dev/null \
            | sort -u \
            | grep -viE '\.(png|jpg|jpeg|gif|svg|ico|webp|bmp|tiff|css|woff|woff2|ttf|otf|eot|mp4|webm|mp3|wav|pdf|zip|tar|gz|tgz|rar|7z|exe|dmg|iso|bin)(\?|$)' \
            > results/js_candidate_pages.txt || true

          TOTAL_CANDIDATES=$(wc -l < results/js_candidate_pages.txt | tr -d ' ')
          MAX_FETCH=200
          echo "JS extraction: $TOTAL_CANDIDATES candidate page(s), fetch cap $MAX_FETCH"

          > results/js_from_html.txt
          COUNT=0
          FETCHED=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            COUNT=$((COUNT+1))
            if [ "$COUNT" -gt "$MAX_FETCH" ]; then
              echo "Fetch cap ($MAX_FETCH) reached, stopping HTML extraction"
              break
            fi

            BODY=$(curl -s --max-time 8 -L "$url" 2>/dev/null || true)
            sleep 0.15
            [ -z "$BODY" ] && continue

            BODY=$(printf '%s' "$BODY" | head -c 262144)
            FETCHED=$((FETCHED+1))

            ORIGIN=$(printf '%s' "$url" | grep -oE '^https?://[^/]+')

            printf '%s' "$BODY" \
              | grep -oE '(src|href)=[^ >]*\.js[^ >]*' 2>/dev/null \
              | sed -E 's/^(src|href)=//' \
              | tr -d '"' | tr -d "'" \
              | while IFS= read -r js_path; do
                  [ -z "$js_path" ] && continue
                  case "$js_path" in
                    http://*|https://*) printf '%s\n' "$js_path" ;;
                    //*)                printf 'https:%s\n' "$js_path" ;;
                    /*)                 printf '%s%s\n' "$ORIGIN" "$js_path" ;;
                    *)                  printf '%s/%s\n' "$ORIGIN" "$js_path" ;;
                  esac
                done >> results/js_from_html.txt
          done < results/js_candidate_pages.txt

          echo "Fetched $FETCHED page(s), extracted $(wc -l < results/js_from_html.txt) JS ref(s) from HTML"

          katana -list results/current_alive_hosts.txt \
                 -jc \
                 -silent \
                 -rate-limit 10 \
                 -depth 2 \
            | grep -E '\.js($|\?)' >> results/js_from_html.txt || true

          sort -u results/js_from_html.txt > results/js_urls_current.txt
          echo "Total JS URLs to scan: $(wc -l < results/js_urls_current.txt)"

      - name: Download JS files and scan for secrets
        run: |
          mkdir -p js_files
          > results/js_secrets_current.txt
          > results/js_content_hashes_seen.txt

          # Secret patterns: AWS keys, Google API keys, Slack tokens, JWTs, private keys, generic api_key assignments
          PATTERN="(AKIA[0-9A-Z]{16})|(AIza[0-9A-Za-z_-]{35})|(xox[baprs]-[0-9A-Za-z-]{10,})|(eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})|(-----BEGIN [A-Z ]*PRIVATE KEY-----)|([Aa]pi[_-]?[Kk]ey.{0,3}[:=].{0,3}[A-Za-z0-9_-]{16,})"

          COUNT=0
          while IFS= read -r jsurl; do
            [ -z "$jsurl" ] && continue
            COUNT=$((COUNT+1))
            # cap how many JS files we pull per run to stay light on the target
            if [ "$COUNT" -gt 100 ]; then
              echo "JS file cap (100) reached, stopping"
              break
            fi
            FNAME="js_files/$(echo "$jsurl" | sha1sum | cut -d' ' -f1).js"
            curl -s --max-time 10 -o "$FNAME" "$jsurl" || continue

            # Dedupe by CONTENT hash, not URL: the same bundle is often served
            # from multiple paths/CDN edge nodes, so without this the same
            # secret gets scanned-and-reported once per path it's served from.
            CONTENT_HASH=$(sha1sum "$FNAME" | cut -d' ' -f1)
            if grep -qx "$CONTENT_HASH" results/js_content_hashes_seen.txt 2>/dev/null; then
              continue
            fi
            echo "$CONTENT_HASH" >> results/js_content_hashes_seen.txt

            MATCHES=$(grep -E -o "$PATTERN" "$FNAME" 2>/dev/null | sort -u || true)
            if [ -n "$MATCHES" ]; then
              while IFS= read -r m; do
                echo "$jsurl | $m" >> results/js_secrets_current.txt
              done <<< "$MATCHES"
            fi
          done < results/js_urls_current.txt
          sort -u results/js_secrets_current.txt -o results/js_secrets_current.txt

      - name: Diff JS secret findings against previous run
        id: js_diff
        run: |
          if [ -f results/js_secrets_previous.txt ]; then
            comm -13 results/js_secrets_previous.txt results/js_secrets_current.txt > results/js_secrets_new.txt
          else
            cp results/js_secrets_current.txt results/js_secrets_new.txt
          fi
          NEW_SECRETS=$(wc -l < results/js_secrets_new.txt | tr -d ' ')
          echo "new_secrets=$NEW_SECRETS" >> "$GITHUB_OUTPUT"

      - name: Notify Discord if new JS secrets found
        if: steps.js_diff.outputs.new_secrets != '0'
        run: |
          # Note: matched secret values are included — this channel should be private
          FINDINGS=$(head -c 1700 results/js_secrets_new.txt)
          CONTENT=$(printf "**Possible secrets found in JS files (Citymesh) — verify manually before reporting:**\n\`\`\`\n%s\n\`\`\`" "$FINDINGS")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Update previous results
        run: |
          cp results/current.txt results/previous.txt
          cp results/current_alive.txt results/previous_alive.txt
          cp results/current_alive_hosts.txt results/previous_alive_hosts.txt
          cp results/nuclei_current.txt results/nuclei_previous.txt
          cp results/ffuf_current.txt results/ffuf_previous.txt
          cp results/bypass_current.txt results/bypass_previous.txt
          cp results/js_secrets_current.txt results/js_secrets_previous.txt

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/previous.txt results/previous_alive.txt results/previous_alive_hosts.txt results/nuclei_previous.txt results/ffuf_previous.txt results/bypass_previous.txt results/js_secrets_previous.txt
          git diff --cached --quiet || git commit -m "Update baselines [skip ci]"
          git push

      - name: Write job summary
        if: always()
        run: |
          TOTAL_SUBS=$(wc -l < results/current.txt 2>/dev/null | tr -d ' ' || echo 0)
          ALIVE_SUBS=$(wc -l < results/current_alive_hosts.txt 2>/dev/null | tr -d ' ' || echo 0)
          NEW_SUBS=$(wc -l < results/new_hosts.txt 2>/dev/null | tr -d ' ' || echo 0)
          TOTAL_NUCLEI=$(wc -l < results/nuclei_current.txt 2>/dev/null | tr -d ' ' || echo 0)
          NEW_NUCLEI=$(wc -l < results/nuclei_new.txt 2>/dev/null | tr -d ' ' || echo 0)
          FUZZED_HOSTS=$(wc -l < results/ffuf_targets.txt 2>/dev/null | tr -d ' ' || echo 0)
          TOTAL_PATHS=$(wc -l < results/ffuf_current.txt 2>/dev/null | tr -d ' ' || echo 0)
          NEW_PATHS=$(wc -l < results/ffuf_new.txt 2>/dev/null | tr -d ' ' || echo 0)
          TOTAL_BYPASSES=$(wc -l < results/bypass_current.txt 2>/dev/null | tr -d ' ' || echo 0)
          NEW_BYPASSES=$(wc -l < results/bypass_new.txt 2>/dev/null | tr -d ' ' || echo 0)
          JS_FILES_SCANNED=$(wc -l < results/js_urls_current.txt 2>/dev/null | tr -d ' ' || echo 0)
          TOTAL_SECRETS=$(wc -l < results/js_secrets_current.txt 2>/dev/null | tr -d ' ' || echo 0)
          NEW_SECRETS=$(wc -l < results/js_secrets_new.txt 2>/dev/null | tr -d ' ' || echo 0)
          FULL_HEADERS_LINES=$(wc -l < results/findings_with_headers_full.txt 2>/dev/null | tr -d ' ' || echo 0)
          PRIORITIZED="${{ steps.prioritize.outputs.prioritized }}"

          {
            echo "## Citymesh Monitor — Run Summary"
            echo ""
            echo "Run time: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Stage | Total | New this run |"
            echo "|---|---|---|"
            echo "| Subdomains found | $TOTAL_SUBS | — |"
            echo "| Live hosts | $ALIVE_SUBS | $NEW_SUBS |"
            echo "| Nuclei findings | $TOTAL_NUCLEI | $NEW_NUCLEI |"
            echo "| Hosts fuzzed ($FUZZED_HOSTS/$ALIVE_SUBS, AI-prioritized: $PRIORITIZED) | — | — |"
            echo "| Directory paths | $TOTAL_PATHS | $NEW_PATHS |"
            echo "| 403 bypasses found | $TOTAL_BYPASSES | $NEW_BYPASSES |"
            echo "| JS files scanned | $JS_FILES_SCANNED | — |"
            echo "| Possible JS secrets | $TOTAL_SECRETS | $NEW_SECRETS |"
            echo "| Full-backlog header lines (weekly / manual test) | $FULL_HEADERS_LINES | — |"
            echo ""
            if [ "$NEW_SUBS" = "0" ] && [ "$NEW_NUCLEI" = "0" ] && [ "$NEW_PATHS" = "0" ] && [ "$NEW_BYPASSES" = "0" ] && [ "$NEW_SECRETS" = "0" ]; then
              echo "No new findings this run — baseline unchanged."
            else
              echo "New findings this run — check Discord for details, or the \`results/\` artifacts below."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full results as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: |
            results/
            results/findings_with_headers.txt
            results/findings_with_headers_full.txt
          retention-days: 7
