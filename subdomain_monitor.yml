name: Subdomain Monitor - Citymesh

# FIXES APPLIED (vs. original):
#  [1] Intigriti R.E. headers (UA + X-Intigriti-Username) added to EVERY target-facing
#      request: httpx/nuclei/ffuf/katana/curl/all Python fetches. Requires a repo secret
#      INTIGRITI_USERNAME with your Intigriti handle.
#  [2] Removed "default-logins" from nuclei BASE_TAGS — those templates submit default
#      credentials = brute force, which the program prohibits.
#  [3] Added concurrency guard so overlapping 6h crons can't stack and blow the 20 req/s cap.
#  [4] bypass_check.py now disables urllib auto-redirects -> the "path variant returned 200"
#      class of false positive (following /x/ -> /login and reporting the login page's 200)
#      is gone. OPTIONS dropped as bypass evidence (204 preflight != bypass). 2xx evidence
#      now requires a non-empty body.
#  [5] Redirect-to-login noise filter (30x -> login|signin|account|auth|register) in both
#      the ffuf flatten stage and the bypass stage — kills the auth-wall noise class.
#  [6] Cloudflare-challenge detection (cf-mitigated: challenge / "Just a moment") — those
#      are suppressed, not treated as restricted assets or bypass candidates.
#  [7] is_real_bypass() now also consults the canary catch-all signature ([18] fingerprint compare).
#  [8] excluded.txt glob patterns are normalized to substrings so *.static.edpnet.net
#      etc. actually match (grep -F on "*.x" never matches "foo.x" — original bug).
#  [9] httpx now uses -follow-host-redirects to avoid scope drift via cross-host hops.
# [10] JS-secret Discord notification redacts matched values (type + 8 chars + file).
# [11] timeout-minutes added; tool versions pinned (adjust as needed).
# [18] Canary baseline replaced: 3 no-redirect probes per host, fingerprinted by
#      status|content-type|normalised-body-hash. Fixes two real bugs — urllib followed
#      302->/login while ffuf did not (baseline/apples-oranges), and the old length-only
#      5% tolerance both missed small catch-alls and over-dropped large distinct pages.
# [19] 401/403 are routed to ffuf_authgated.txt and NEVER enter findings. Redirects that
#      only add a trailing slash, or that leave the host, are canonicalised away.
# [20] Sensitive-file validation is basename + content-type + magic-byte aware and fails
#      closed: unverified content is dropped, not reported.
# [21] Auth walls are detected from the followed body (login form markers), not only the
#      Location header.
# [22] Hosts resolving into a program-excluded CIDR are dropped before any fuzzing.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:
    inputs:
      smoke_test:
        description: 'Run smoke test only (Discord + AI triage check, no scanning)'
        required: false
        default: false
        type: boolean
      draft_report:
        description: 'Draft an Intigriti report MD from scan data (manual use, forces report even if empty diffs)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# [3] Prevent stacked scheduled runs (consecutive 6h slots can overlap due to runner lag)
concurrency:
  group: citymesh-monitor
  cancel-in-progress: false

env:
  # [1] Set your Intigriti handle as a repo secret named INTIGRITI_USERNAME.
  INTIGRITI_H: ${{ secrets.INTIGRITI_USERNAME }}
  INTIGRITI_UA: Intigriti-VDP-SubdomainMonitor/1.0

jobs:
  smoke_test:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_test == true
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      COHERE_API_KEY_2: ${{ secrets.COHERE_API_KEY_2 }}
      COHERE_API_KEY_3: ${{ secrets.COHERE_API_KEY_3 }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Test Discord webhook
        run: |
          CONTENT="Smoke test: Discord webhook is reachable. $(date -u '+%Y-%m-%d %H:%M UTC')"
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL")
          echo "Discord response code: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Discord webhook returned $HTTP_CODE — check DISCORD_WEBHOOK_URL secret"
            exit 1
          fi

      - name: Test AI triage pipeline (multi-key rotation, Gemini -> DeepSeek -> Cohere fallback)
        run: |
          PROMPT_TEXT="Reply with exactly one short sentence confirming you received this test message."
          SUMMARY=""
          PROVIDER="none"

          # Try each Gemini key in turn until one succeeds
          for KEY_VAR in GEMINI_API_KEY GEMINI_API_KEY_2 GEMINI_API_KEY_3; do
            KEY_VAL="${!KEY_VAR}"
            [ -z "$KEY_VAL" ] && continue
            GEMINI_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" '{contents: [{parts: [{text: $text}]}]}')
            GEMINI_RESPONSE=$(curl -s -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=$KEY_VAL" \
              -H "Content-Type: application/json" -d "$GEMINI_PAYLOAD")
            SUMMARY=$(echo "$GEMINI_RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null || echo "")
            echo "Tried $KEY_VAR -> $([ -n "$SUMMARY" ] && echo "success" || echo "failed: $GEMINI_RESPONSE")"
            if [ -n "$SUMMARY" ]; then
              PROVIDER="Gemini ($KEY_VAR)"
              break
            fi
          done

          # Tier 2: DeepSeek — deepseek-flash (only live model name; chat/reasoner aliases retired 2026-07)
          if [ -z "$SUMMARY" ]; then
            if [ -n "$DEEPSEEK_API_KEY" ]; then
              DEEPSEEK_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" \
                '{model: "deepseek-flash", messages: [{role: "user", content: $text}]}')
              DEEPSEEK_RESPONSE=$(curl -s -X POST "https://api.deepseek.com/v1/chat/completions" \
                -H "Content-Type: application/json" -H "Authorization: Bearer $DEEPSEEK_API_KEY" -d "$DEEPSEEK_PAYLOAD")
              SUMMARY=$(echo "$DEEPSEEK_RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || echo "")
              if [ -n "$SUMMARY" ]; then PROVIDER="DeepSeek (deepseek-flash, tier-2)"; else echo "DeepSeek failed: $DEEPSEEK_RESPONSE"; fi
            fi
          fi

          # Try each Cohere key in turn if every Gemini key failed
          if [ -z "$SUMMARY" ]; then
            for KEY_VAR in COHERE_API_KEY COHERE_API_KEY_2 COHERE_API_KEY_3; do
              KEY_VAL="${!KEY_VAR}"
              [ -z "$KEY_VAL" ] && continue
              COHERE_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" '{model: "command-a-03-2025", messages: [{role: "user", content: $text}]}')
              COHERE_RESPONSE=$(curl -s -X POST "https://api.cohere.com/v2/chat" \
                -H "Content-Type: application/json" -H "Authorization: Bearer $KEY_VAL" -d "$COHERE_PAYLOAD")
              SUMMARY=$(echo "$COHERE_RESPONSE" | jq -r '.message.content[0].text // empty' 2>/dev/null || echo "")
              if [ -n "$SUMMARY" ]; then
                PROVIDER="Cohere ($KEY_VAR, fallback)"
                break
              fi
            done
          fi

          if [ -z "$SUMMARY" ]; then
            SUMMARY="AI triage FAILED — every configured Gemini key, DeepSeek, and Cohere key failed. Check API keys and provider status."
            PROVIDER="none"
          fi

          CONTENT=$(printf "Smoke test — AI triage via **%s**:\n\`\`\`\n%s\n\`\`\`" "$PROVIDER" "$SUMMARY")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

          echo "SMOKE_PROVIDER=$PROVIDER" >> "$GITHUB_ENV"
          echo "SMOKE_SUMMARY=$SUMMARY" >> "$GITHUB_ENV"

      - name: Write smoke test summary
        if: always()
        run: |
          {
            echo "## Smoke Test Results"
            echo ""
            echo "Run time: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "Discord webhook: reachable (see step above for status code)"
            echo "AI triage provider that responded: **${SMOKE_PROVIDER:-unknown}**"
            echo ""
            echo "AI response:"
            echo '```'
            echo "${SMOKE_SUMMARY:-no response captured}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  monitor:
    if: github.event_name != 'workflow_dispatch' || inputs.smoke_test != true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # environment: production   # uncomment + set name if webhook is an Environment secret
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install subfinder, httpx, nuclei, ffuf and katana
        run: |
          # pinned versions [11] — bump deliberately, not automatically
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@v2.6.7
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@v1.6.9
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.4.4
          go install -v github.com/ffuf/ffuf/v2@v2.1.0
          go install -v github.com/projectdiscovery/katana/cmd/katana@v1.1.1
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Download wordlist for directory bruteforce
        run: |
          mkdir -p wordlists
          curl -s -o wordlists/common.txt \
            https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt

      - name: Write subfinder provider config
        env:
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          CENSYS_API_ID: ${{ secrets.CENSYS_API_ID }}
          CENSYS_API_SECRET: ${{ secrets.CENSYS_API_SECRET }}
          ZOOMEYE_API_KEY: ${{ secrets.ZOOMEYE_API_KEY }}
          FOFA_EMAIL: ${{ secrets.FOFA_EMAIL }}
          FOFA_KEY: ${{ secrets.FOFA_KEY }}
          NETLAS_API_KEY: ${{ secrets.NETLAS_API_KEY }}
          LEAKIX_API_KEY: ${{ secrets.LEAKIX_API_KEY }}
          CRIMINALIP_API_KEY: ${{ secrets.CRIMINALIP_API_KEY }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          mkdir -p "$HOME/.config/subfinder"
          cat > "$HOME/.config/subfinder/provider-config.yaml" <<EOF
          shodan:
            - $SHODAN_API_KEY
          censys:
            - $CENSYS_API_ID:$CENSYS_API_SECRET
          zoomeye:
            - $ZOOMEYE_API_KEY
          fofa:
            - $FOFA_EMAIL:$FOFA_KEY
          netlas:
            - $NETLAS_API_KEY
          leakix:
            - $LEAKIX_API_KEY
          criminalip:
            - $CRIMINALIP_API_KEY
          virustotal:
            - $VIRUSTOTAL_API_KEY
          EOF

      - name: Run subdomain enumeration across all targets
        run: |
          mkdir -p results
          # single multi-domain invocation — subfinder's -dL handles internal
          # concurrency across all targets at once
          subfinder -dL targets.txt -silent -all -o results/current_raw.txt || touch results/current_raw.txt
          sort -u results/current_raw.txt -o results/current_raw.txt

      - name: Filter out-of-scope subdomains
        run: |
          # [8] excluded.txt may contain glob-style entries like *.static.edpnet.net.
          # grep -F never substring-matches "foo.static.edpnet.net" against the literal
          # "*.static.edpnet.net", so normalize to bare substrings first.
          if [ -s excluded.txt ]; then
            sed 's/^\*\.\?//' excluded.txt > excluded_subs.txt
            grep -v -F -f excluded_subs.txt results/current_raw.txt > results/current.txt || true
          else
            cp results/current_raw.txt results/current.txt
          fi
          sort -u results/current.txt -o results/current.txt

      - name: Probe for live hosts with httpx
        run: |
          # rate-limit kept under Citymesh's 20 req/sec cap
          # [1] program headers        [9] same-host redirects only (no scope drift)
          httpx -l results/current.txt -silent -status-code -title \
                -tech-detect \
                -follow-host-redirects \
                -rate-limit 15 \
                -H "X-Intigriti-Username: $INTIGRITI_H" \
                -H "User-Agent: $INTIGRITI_UA" \
                -o results/current_alive.txt || touch results/current_alive.txt
          sort -u results/current_alive.txt -o results/current_alive.txt

          # Extract hostname-only column (first field) for diffing
          awk '{print $1}' results/current_alive.txt | sort -u > results/current_alive_hosts.txt

      - name: Enforce IP scope (drop hosts resolving out-of-scope)
        run: |
          # [22] The program carves specific CIDRs out of the Citymesh space. A wildcard
          # hostname that resolves into one of them must never be probed, or the run is
          # out of scope regardless of the hostname. Fail closed: unresolved == dropped.
          python3 - << 'PYEOF'
          import ipaddress
          import socket
          import urllib.parse

          def host_of(entry):
              """Entries are httpx line-leads (full URLs with scheme). Extract the
              hostname, stripping userinfo/port so DNS actually resolves."""
              e = entry.strip()
              if "://" in e:
                  netloc = urllib.parse.urlparse(e).netloc or e.split("/", 3)[2]
                  netloc = netloc.rsplit("@", 1)[-1]
                  if netloc.startswith("[") and "]" in netloc:      # IPv6 literal
                      return netloc[1:netloc.index("]")]
                  return netloc.split(":")[0].lower()
              return e.split("/")[0].lower()

          OOS_CIDRS = [
              "31.31.128.64/26", "31.31.128.128/26", "31.31.128.192/27",
              "31.31.130.0/23", "31.31.132.0/24", "31.31.134.0/23",
              "31.31.136.0/21", "31.31.139.0/24", "31.31.141.0/26",
          ]
          IN_CIDRS = [
              "31.31.128.0/24", "31.31.140.0/24", "31.31.141.0/24",
              "31.31.143.0/24", "31.31.143.0/25", "31.31.150.0/24",
              "31.31.158.0/24", "31.31.159.0/24",
              "45.11.166.40/29", "79.132.241.0/24",
              "85.234.192.0/24", "85.234.203.0/24", "85.234.204.0/24",
              "85.234.205.0/24", "193.110.255.128/28",
              "212.71.0.0/24", "212.71.1.0/24", "212.71.2.0/24",
              "212.71.3.0/24", "212.71.4.0/24", "212.71.5.0/24",
              "212.71.8.0/24", "212.71.11.0/24",
              "213.211.130.0/24", "213.211.138.0/24", "213.211.188.0/24",
              "213.219.128.0/24", "213.219.132.0/24",
          ]
          # Non-CIDR-aligned carve-outs taken verbatim from the program page.
          HARD_DENY = [("31.31.140.0", "31.31.140.87"),
                       ("31.31.140.92", "31.31.140.254"),
                       ("31.31.143.0", "31.31.143.71")]
          RULES = ([(ipaddress.ip_network(c), False) for c in OOS_CIDRS]
                   + [(ipaddress.ip_network(c), True) for c in IN_CIDRS])

          def scope_ok(host):
              try:
                  ips = {ipaddress.ip_address(a) for a in socket.gethostbyname_ex(host)[2]}
              except Exception:
                  return False, "unresolved"
              if not ips:
                  return False, "no A records"

              # Most-specific-wins: 31.31.136.0/21 is excluded, but the /24s inside it
              # are explicitly in scope, and the fine carve-outs override both. Default
              # is allow so CDN-fronted hosts (Cloudflare etc.) are never dropped.
              for ip in ips:
                  for a, b in HARD_DENY:
                      if ipaddress.ip_address(a) <= ip <= ipaddress.ip_address(b):
                          return False, f"{ip} in excluded range {a}-{b}"
                  best = None
                  for net, allow in RULES:
                      if ip in net and (best is None or net.prefixlen > best[0]):
                          best = (net.prefixlen, allow)
                  if best is not None and not best[1]:
                      return False, f"{ip} excluded ({best[0]}-bit match)"
              return True, ",".join(str(i) for i in sorted(ips))

          keep, drop = [], []
          for line in open("results/current_alive_hosts.txt"):
              if not line.strip():
                  continue
              # Keep the original URL entry (current_alive_hosts.txt contract: feeds
              # comm, katana -list, ffuf). Parse the hostname out only for DNS/scope.
              entry = line.strip()
              ok, why = scope_ok(host_of(entry))
              (keep if ok else drop).append((entry, why))

          # current_alive_hosts.txt is a hostname-only contract (feeds comm, nuclei,
          # katana, ffuf). Annotations go to separate files, never into it.
          with open("results/current_alive_hosts.txt", "w") as out:
              out.write("".join(f"{h}\n" for h, _ in keep))
          with open("results/scope_kept.txt", "w") as out:
              out.write("".join(f"{h}  [{why}]\n" for h, why in keep))
          with open("results/scope_dropped.txt", "w") as out:
              out.write("".join(f"{h}  [{why}]\n" for h, why in drop))

          print(f"Scope: kept {len(keep)}, dropped {len(drop)}")
          for h, why in drop:
              print(f"  DROP {h}  [{why}]")
          PYEOF

          # Keep the detailed alive list in sync, comparing the FIRST field only so
          # api.citymesh.com cannot resurrect xapi.citymesh.com as a substring match.
          if [ -s results/current_alive_hosts.txt ]; then
            awk 'NR==FNR {keep[$1]=1; next} ($1 in keep)' \
              results/current_alive_hosts.txt results/current_alive.txt \
              > results/current_alive.filtered
          else
            : > results/current_alive.filtered
          fi
          mv results/current_alive.filtered results/current_alive.txt

      - name: Diff against previous alive hosts
        id: diff
        run: |
          if [ -f results/previous_alive_hosts.txt ]; then
            comm -13 results/previous_alive_hosts.txt results/current_alive_hosts.txt > results/new_hosts.txt
          else
            cp results/current_alive_hosts.txt results/new_hosts.txt
          fi

          NEW_COUNT=$(wc -l < results/new_hosts.txt | tr -d ' ')
          echo "new_count=$NEW_COUNT" >> "$GITHUB_OUTPUT"

          # Pull full detail lines (with status/title) for only the new hosts
          if [ -s results/new_hosts.txt ]; then
            grep -F -f results/new_hosts.txt results/current_alive.txt > results/new_detail.txt
          else
            touch results/new_detail.txt
          fi

      - name: Notify Discord if new live subdomains found
        if: steps.diff.outputs.new_count != '0'
        run: |
          NEW_SUBS=$(cat results/new_detail.txt)
          CONTENT=$(printf "**New live subdomains found for Citymesh:**\n\`\`\`\n%s\n\`\`\`" "$NEW_SUBS")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Update nuclei templates
        run: nuclei -update-templates -silent || true

      - name: Scan live hosts with nuclei (per-host tech targeting)
        run: |
          # Per-host tech targeting: hosts grouped by httpx-detected tech signature,
          # nuclei runs once per group with only the relevant tags. Groups run
          # sequentially so combined request rate stays under Citymesh's 20/sec cap.
          #
          # [2] "default-logins" removed from BASE_TAGS: those templates submit default
          #     credentials, which the program's rules prohibit (no brute force).
          BASE_TAGS="exposures,misconfiguration,takeovers,cves"

          GROUPS_DIR="results/nuclei_groups"
          mkdir -p "$GROUPS_DIR"
          rm -f "$GROUPS_DIR"/*

          # Parse httpx output, group hosts by tech signature, write per-group
          # host and tag files. Uses Python for the parsing because httpx's
          # output format (URL [status] [title] [tech,tech]) is genuinely
          # annoying to parse unambiguously in pure shell.
          python3 - << 'PYEOF'
          import os
          import re

          BASE_TAGS = "exposures,misconfiguration,takeovers,cves"

          KNOWN_TECHS = {
              "php", "wordpress", "laravel", "drupal", "joomla", "jquery",
              "vue", "react", "angular", "iis", "nginx", "apache", "tomcat",
              "spring", "django", "ruby", "asp.net",
          }
          TECH_ALIASES = {"aspnet": "asp.net"}

          BRACKET_RE = re.compile(r"\[([^\]]*)\]")

          GROUPS_DIR = "results/nuclei_groups"
          os.makedirs(GROUPS_DIR, exist_ok=True)

          groups = {}
          total_lines = 0
          parsed_with_tech = 0

          with open("results/current_alive.txt") as fh:
              for line in fh:
                  line = line.rstrip("\n")
                  if not line.strip():
                      continue
                  total_lines += 1
                  host = line.split()[0]

                  techs = []
                  for b in reversed(BRACKET_RE.findall(line)):
                      parts = [p.strip() for p in b.split(",") if p.strip()]
                      if not parts:
                          continue
                      matched = []
                      for p in parts:
                          name = p.split(":")[0].strip().lower()
                          name = TECH_ALIASES.get(name, name)
                          if name in KNOWN_TECHS:
                              matched.append(name)
                      if matched and len(matched) == len(parts):
                          techs = sorted(set(matched))
                          break

                  if techs:
                      parsed_with_tech += 1

                  key = ",".join(techs) if techs else "_BASE_"
                  entry = groups.setdefault(key, {"techs": techs, "hosts": []})
                  entry["hosts"].append(host)

          def sort_key(item):
              key = item[0]
              return (key != "_BASE_", key)

          group_list = sorted(groups.items(), key=sort_key)
          for i, (key, entry) in enumerate(group_list):
              prefix = f"{GROUPS_DIR}/group_{i:02d}"
              with open(f"{prefix}_hosts.txt", "w") as fh:
                  fh.write("\n".join(entry["hosts"]) + "\n")
              tags = BASE_TAGS + ("," + ",".join(entry["techs"]) if entry["techs"] else "")
              with open(f"{prefix}_tags.txt", "w") as fh:
                  fh.write(tags)

          print(f"Parsed {total_lines} live host lines ({parsed_with_tech} with tech detected)")
          print(f"Nuclei will run in {len(group_list)} group(s):")
          for i, (key, entry) in enumerate(group_list):
              label = ",".join(entry["techs"]) if entry["techs"] else "base tags only"
              print(f"  Group {i:02d}: {len(entry['hosts']):3d} hosts — {label}")
          PYEOF

          # Run nuclei once per group. [1] program headers on every probe.
          > results/nuclei_current.txt
          for tags_file in "$GROUPS_DIR"/group_*_tags.txt; do
            [ -f "$tags_file" ] || continue
            prefix="${tags_file%_tags.txt}"
            hosts_file="${prefix}_hosts.txt"
            out_file="${prefix}_out.txt"

            tags=$(cat "$tags_file")
            host_count=$(wc -l < "$hosts_file" | tr -d ' ')
            echo "── Running nuclei: $host_count host(s), tags: $tags"

            nuclei -l "$hosts_file" \
                   -tags "$tags" \
                   -severity low,medium,high,critical \
                   -rate-limit 15 \
                   -H "X-Intigriti-Username: $INTIGRITI_H" \
                   -H "User-Agent: $INTIGRITI_UA" \
                   -silent \
                   -o "$out_file" || touch "$out_file"

            cat "$out_file" >> results/nuclei_current.txt 2>/dev/null || true
          done
          sort -u results/nuclei_current.txt -o results/nuclei_current.txt
          echo "Total nuclei findings this run: $(wc -l < results/nuclei_current.txt | tr -d ' ')"

      - name: Diff nuclei findings against previous run
        id: nuclei_diff
        run: |
          if [ -f results/nuclei_previous.txt ]; then
            comm -13 results/nuclei_previous.txt results/nuclei_current.txt > results/nuclei_new.txt
          else
            cp results/nuclei_current.txt results/nuclei_new.txt
          fi

          NEW_FINDINGS=$(wc -l < results/nuclei_new.txt | tr -d ' ')
          echo "new_findings=$NEW_FINDINGS" >> "$GITHUB_OUTPUT"

      - name: AI-triage new nuclei findings
        id: triage
        if: steps.nuclei_diff.outputs.new_findings != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_API_KEY_2: ${{ secrets.COHERE_API_KEY_2 }}
          COHERE_API_KEY_3: ${{ secrets.COHERE_API_KEY_3 }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          FINDINGS=$(cat results/nuclei_new.txt)
          INSTRUCTIONS="You are triaging bug bounty / responsible-disclosure scan output for the Citymesh program (no bounty, points/reputation only). Below is nuclei output listing NEW findings from this scan cycle. For each finding, briefly note what it is and whether it looks worth manual follow-up. Group by severity (critical/high first). Flag anything that overlaps with Citymesh's excluded finding categories (e.g. missing headers, verbose errors without sensitive data, CSRF with low impact, disclosed API keys without proven business impact, CORS on non-sensitive endpoints) as LOW PRIORITY / likely not reportable. End with a short list of the top 3 findings worth investigating manually first, or state clearly if nothing looks worth pursuing. HARD RULES: standalone version/banner disclosure, missing cookie flags or security headers, 301/302/401/403 responses, and login redirects are NOT findings. Be concise, plain text, no markdown headers."
          PROMPT_TEXT=$(printf "%s\n\nFINDINGS:\n%s" "$INSTRUCTIONS" "$FINDINGS")

          SUMMARY=""
          PROVIDER="none"

          for KEY_VAR in GEMINI_API_KEY GEMINI_API_KEY_2 GEMINI_API_KEY_3; do
            KEY_VAL="${!KEY_VAR}"
            [ -z "$KEY_VAL" ] && continue
            GEMINI_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" '{contents: [{parts: [{text: $text}]}]}')
            GEMINI_RESPONSE=$(curl -s -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=$KEY_VAL" \
              -H "Content-Type: application/json" \
              -d "$GEMINI_PAYLOAD")
            SUMMARY=$(echo "$GEMINI_RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null || echo "")
            if [ -n "$SUMMARY" ]; then
              PROVIDER="Gemini ($KEY_VAR)"
              break
            fi
          done

          # Tier 2: DeepSeek — deepseek-flash (only live model name; chat/reasoner aliases retired 2026-07)
          if [ -z "$SUMMARY" ]; then
            if [ -n "$DEEPSEEK_API_KEY" ]; then
              DEEPSEEK_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" \
                '{model: "deepseek-flash", messages: [{role: "user", content: $text}]}')
              DEEPSEEK_RESPONSE=$(curl -s -X POST "https://api.deepseek.com/v1/chat/completions" \
                -H "Content-Type: application/json" -H "Authorization: Bearer $DEEPSEEK_API_KEY" -d "$DEEPSEEK_PAYLOAD")
              SUMMARY=$(echo "$DEEPSEEK_RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || echo "")
              if [ -n "$SUMMARY" ]; then PROVIDER="DeepSeek (deepseek-flash, tier-2)"; else echo "DeepSeek failed: $DEEPSEEK_RESPONSE"; fi
            fi
          fi

          if [ -z "$SUMMARY" ]; then
            for KEY_VAR in COHERE_API_KEY COHERE_API_KEY_2 COHERE_API_KEY_3; do
              KEY_VAL="${!KEY_VAR}"
              [ -z "$KEY_VAL" ] && continue
              COHERE_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" \
                '{model: "command-a-03-2025", messages: [{role: "user", content: $text}]}')
              COHERE_RESPONSE=$(curl -s -X POST "https://api.cohere.com/v2/chat" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $KEY_VAL" \
                -d "$COHERE_PAYLOAD")
              SUMMARY=$(echo "$COHERE_RESPONSE" | jq -r '.message.content[0].text // empty' 2>/dev/null || echo "")
              if [ -n "$SUMMARY" ]; then
                PROVIDER="Cohere ($KEY_VAR, fallback)"
                break
              fi
            done
          fi

          echo "AI triage provider used: $PROVIDER"

          if [ -z "$SUMMARY" ]; then
            SUMMARY=$(printf "AI triage unavailable this run — raw findings:\n%s" "$(head -c 1200 results/nuclei_new.txt)")
          fi

          echo "$SUMMARY" > results/ai_summary.txt

      - name: Notify Discord if new nuclei findings
        if: steps.nuclei_diff.outputs.new_findings != '0'
        run: |
          SUMMARY=$(head -c 1700 results/ai_summary.txt)
          CONTENT=$(printf "**New nuclei findings for Citymesh (AI-triaged):**\n\`\`\`\n%s\n\`\`\`" "$SUMMARY")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: AI-prioritize hosts worth fuzzing
        id: prioritize
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_API_KEY_2: ${{ secrets.COHERE_API_KEY_2 }}
          COHERE_API_KEY_3: ${{ secrets.COHERE_API_KEY_3 }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          HOSTS_INFO=$(head -n 150 results/current_alive.txt)
          TOTAL_HOSTS=$(wc -l < results/current_alive_hosts.txt | tr -d ' ')

          INSTRUCTIONS="You are prioritizing which live hosts are worth deep directory bruteforcing in a responsible-disclosure recon pipeline. Below is a list of live hosts with their HTTP status code and page title, one per line. Pick the hosts most likely to be real applications, admin panels, APIs, portals, or dashboards worth fuzzing for hidden paths — favor hostnames like auth., api., admin., portal., my., dashboard., app., cabmanager., gateway. Deprioritize and EXCLUDE hosts that look like static marketing pages, CDN/asset hosts, parked domains, pure redirects with no distinct title, or anything clearly not an application. Return ONLY the full URLs to fuzz, one per line, nothing else — no numbering, no explanation, no markdown. Return at most 20 URLs, chosen by likely value."
          PROMPT_TEXT=$(printf "%s\n\nHOSTS:\n%s" "$INSTRUCTIONS" "$HOSTS_INFO")

          AI_OUTPUT=""
          PROVIDER="none"

          for KEY_VAR in GEMINI_API_KEY GEMINI_API_KEY_2 GEMINI_API_KEY_3; do
            KEY_VAL="${!KEY_VAR}"
            [ -z "$KEY_VAL" ] && continue
            GEMINI_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" '{contents: [{parts: [{text: $text}]}]}')
            GEMINI_RESPONSE=$(curl -s -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=$KEY_VAL" \
              -H "Content-Type: application/json" -d "$GEMINI_PAYLOAD")
            AI_OUTPUT=$(echo "$GEMINI_RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null || echo "")
            if [ -n "$AI_OUTPUT" ]; then
              PROVIDER="Gemini ($KEY_VAR)"
              break
            fi
          done

          # Tier 2: DeepSeek — deepseek-flash (only live model name; chat/reasoner aliases retired 2026-07)
          if [ -z "$AI_OUTPUT" ]; then
            if [ -n "$DEEPSEEK_API_KEY" ]; then
              DEEPSEEK_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" \
                '{model: "deepseek-flash", messages: [{role: "user", content: $text}]}')
              DEEPSEEK_RESPONSE=$(curl -s -X POST "https://api.deepseek.com/v1/chat/completions" \
                -H "Content-Type: application/json" -H "Authorization: Bearer $DEEPSEEK_API_KEY" -d "$DEEPSEEK_PAYLOAD")
              AI_OUTPUT=$(echo "$DEEPSEEK_RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || echo "")
              if [ -n "$AI_OUTPUT" ]; then PROVIDER="DeepSeek (deepseek-flash, tier-2)"; else echo "DeepSeek failed: $DEEPSEEK_RESPONSE"; fi
            fi
          fi

          if [ -z "$AI_OUTPUT" ]; then
            for KEY_VAR in COHERE_API_KEY COHERE_API_KEY_2 COHERE_API_KEY_3; do
              KEY_VAL="${!KEY_VAR}"
              [ -z "$KEY_VAL" ] && continue
              COHERE_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" \
                '{model: "command-a-03-2025", messages: [{role: "user", content: $text}]}')
              COHERE_RESPONSE=$(curl -s -X POST "https://api.cohere.com/v2/chat" \
                -H "Content-Type: application/json" -H "Authorization: Bearer $KEY_VAL" -d "$COHERE_PAYLOAD")
              AI_OUTPUT=$(echo "$COHERE_RESPONSE" | jq -r '.message.content[0].text // empty' 2>/dev/null || echo "")
              if [ -n "$AI_OUTPUT" ]; then
                PROVIDER="Cohere ($KEY_VAR, fallback)"
                break
              fi
            done
          fi

          echo "Prioritization provider: $PROVIDER"

          echo "$AI_OUTPUT" | grep -E '^https?://' | sort -u > results/ffuf_targets.txt || true

          # === [13] Fuzz rotation: re-fuzz a host only if it is NEW since the last run,
          # or last fuzzed >7 days ago. Steady-state drastically cuts per-run fuzz time
          # while the weekly-convergence property keeps every host re-fuzzed each week.
          python3 - << 'PYEOF'
          import json
          import os
          import time

          LOG = "results/fuzz_log.json"
          window = 7 * 24 * 3600
          now = time.time()
          last = {}
          if os.path.exists(LOG):
              try:
                  last = json.load(open(LOG))
              except Exception:
                  last = {}

          try:
              targets = [l.strip() for l in open("results/ffuf_targets.txt") if l.strip()]
          except FileNotFoundError:
              targets = []
          try:
              alive = [l.strip() for l in open("results/current_alive_hosts.txt") if l.strip()]
          except FileNotFoundError:
              alive = []
          try:
              new_hosts = {l.strip() for l in open("results/new_hosts.txt") if l.strip()}
          except FileNotFoundError:
              new_hosts = set()

          def eligible(h):
              return h in new_hosts or (now - last.get(h, 0)) > window

          chosen = [h for h in targets if eligible(h)]

          # Top-up from alive list (oldest-fuzzed-first) if AI picks were all recently fuzzed
          if len(chosen) < 5:
              remaining = [h for h in alive if eligible(h) and h not in chosen]
              remaining.sort(key=lambda h: last.get(h, 0))
              chosen += remaining[:14 - len(chosen)]
          chosen = sorted(set(chosen))[:14]  # hard cap: 4 batches of 4 parallel

          with open("results/ffuf_targets.txt", "w") as out:
              out.write("\n".join(chosen) + "\n" if chosen else "")

          # record fuzz attempt timestamps for the chosen hosts (appended post-run too)
          for h in chosen:
              last[h] = now
          with open(LOG, "w") as out:
              json.dump(last, out)

          print(f"Rotation: {len(chosen)} hosts eligible this run "
                f"({sum(1 for h in chosen if h in new_hosts)} new, "
                f"{sum(1 for h in chosen if h not in new_hosts)} stale-filled)")
          PYEOF

          # Safety net if AI failed or returned nothing usable
          FILTERED_COUNT=$(wc -l < results/ffuf_targets.txt | tr -d ' ')
          if [ "$FILTERED_COUNT" = "0" ]; then
            echo "AI prioritization returned nothing usable — falling back to first 15 live hosts"
            head -n 15 results/current_alive_hosts.txt > results/ffuf_targets.txt
            echo "prioritized=false" >> "$GITHUB_OUTPUT"
          else
            echo "prioritized=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Fuzzing $(wc -l < results/ffuf_targets.txt | tr -d ' ') of $TOTAL_HOSTS live hosts"

      - name: Directory bruteforce with ffuf
        run: |
          mkdir -p results/ffuf_tmp
          rm -f results/ffuf_tmp/*

          # Step A: canary baseline per host BEFORE fuzzing.
          # [18] Three random, redirect-suppressed probes per host, fingerprinted by
          # status|content-type|normalised-body-hash. ffuf runs without -r, so the
          # baseline must be collected the same way (the old urllib call followed
          # 302->/login and compared the login page against ffuf's 302).
          python3 - << 'PYEOF'
          import hashlib
          import json
          import os
          import re
          import secrets
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          INTIGRITI = {
              "User-Agent": os.environ.get("INTIGRITI_UA", "Intigriti-VDP-SubdomainMonitor/1.0"),
              "X-Intigriti-Username": os.environ.get("INTIGRITI_H", ""),
          }

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k):
                  return None

          OPENER = urllib.request.build_opener(NoRedirect)

          def normalise(raw, path):
              t = raw[:8192].decode("utf-8", "ignore")
              t = t.replace(path, "")                    # kill path reflection
              t = re.sub(r"[0-9a-fA-F]{16,}", "", t)     # ids / hashes
              t = re.sub(r"\d+", "N", t)                 # numbers / timestamps
              return re.sub(r"\s+", " ", t).strip().lower()

          def fingerprint(url):
              try:
                  req = urllib.request.Request(url, headers=INTIGRITI)
                  with OPENER.open(req, timeout=8) as r:
                      raw, status = r.read(8192), r.status
                      ct = r.headers.get("Content-Type", "").split(";")[0]
              except urllib.error.HTTPError as e:
                  raw = e.read(8192) if e.fp else b""
                  status = e.code
                  ct = (e.headers.get("Content-Type", "").split(";")[0] if e.headers else "")
              except Exception:
                  return None
              path = urllib.parse.urlparse(url).path
              h = hashlib.sha256(normalise(raw, path).encode()).hexdigest()[:16]
              return f"{status}|{ct}|{h}"

          sigs = {}
          with open("results/ffuf_targets.txt") as f:
              for line in f:
                  host = line.strip().rstrip("/")
                  if not host:
                      continue
                  base = set()
                  for _ in range(3):
                      fp = fingerprint(host + "/" + secrets.token_hex(10))
                      if fp:
                          base.add(fp)
                      time.sleep(0.2)   # polite spacing — stays under the 20 req/s cap
                  sigs[host] = {"reachable": bool(base), "baseline": sorted(base)}

          with open("results/canary_signatures.json", "w") as out:
              json.dump(sigs, out, indent=2)

          # [14] fuzz-active list: drop unreachable hosts only. Catch-all hosts are kept
          # here but neutralised per-response by the baseline fingerprint in the flatten
          # stage — that also catches catch-alls that vary by length.
          active = [h for h, s in sigs.items() if s["reachable"]]
          with open("results/ffuf_targets_active.txt", "w") as out:
              out.write("\n".join(active) + ("\n" if active else ""))

          print(f"Canary baselines captured for {len(sigs)} hosts:")
          for h, s in sigs.items():
              tag = ("unreachable" if not s["reachable"]
                     else f"{len(s['baseline'])} baseline fingerprint(s)")
              print(f"  {h} -> {tag}")
          print(f"Fuzz-active targets: {len(active)}/{len(sigs)}")
          PYEOF

          # [15] per-ffuf hard timeout: 1500s covers a full 4.4k-wordlist host at
          # -rate 4 (1100s nominal) with margin; the flatten stage tolerates
          # truncated per-host JSON, so a timeout kill loses no processed results.
          cat results/ffuf_targets_active.txt | xargs -P 4 -I{} bash -c '
            host="$1"
            [ -z "$host" ] && exit 0
            safe_name=$(echo "$host" | sha1sum | cut -d" " -f1)
            timeout 1500 ffuf -u "${host}/FUZZ" \
                 -w wordlists/common.txt \
                 -mc 200,201,202,301,302,307,401,403 \
                 -ac \
                 -rate 4 \
                 -t 15 \
                 -timeout 8 \
                 -H "X-Intigriti-Username: $INTIGRITI_H" \
                 -H "User-Agent: $INTIGRITI_UA" \
                 -o "results/ffuf_tmp/${safe_name}.json" \
                 -of json \
              > /dev/null 2>&1 || true
          ' _ {}

          # Step C: flatten JSON hits and apply the evidence gate.
          # [19] 401/403 -> authgated (never findings); slash-only/cross-host redirects dropped.
          # [18] 2xx bodies are fingerprinted against the canary baseline (kills catch-alls).
          # [20] sensitive files validated by content-type + magic bytes + basename; fail closed.
          # [21] auth walls detected from the followed body, not just the Location string.
          python3 - << 'PYEOF'
          import glob
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import Counter

          INTIGRITI = {
              "User-Agent": os.environ.get("INTIGRITI_UA", "Intigriti-VDP-SubdomainMonitor/1.0"),
              "X-Intigriti-Username": os.environ.get("INTIGRITI_H", ""),
          }

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k):
                  return None

          OPENER = urllib.request.build_opener(NoRedirect)

          with open("results/canary_signatures.json") as f:
              canaries = json.load(f)

          WORDLIST_SIZE = sum(1 for _ in open("wordlists/common.txt"))
          THRESHOLD = WORDLIST_SIZE * 60 // 100

          NOISE_RE = re.compile(
              r"/(favicon\.ico|robots\.txt|sitemap\.xml|\.well-known/(http-opportunistic|acme-challenge|pki-validation))( |\[|$)"
          )
          REDIRECT_LOGIN_RE = re.compile(
              r"(^|/)(login|signin|sign-in|register|auth|account/login|account/register)(/|\?|$)", re.I
          )
          LOGIN_FORM_RE = re.compile(
              r'type=["\']?password|name=["\']?username|id=["\']?login|forgot password', re.I
          )
          CT_BLOCK = {"text/html", "application/xhtml+xml"}

          # [20] basename -> required markers. A hit must contain at least one marker.
          MARKERS = {
              ".env":               [b"DB_PASSWORD", b"SECRET_KEY", b"API_KEY", b"TOKEN", b"AWS_"],
              ".git/head":          [b"ref: refs/", b"HEAD detached"],
              ".git/config":        [b"[core]", b"[remote", b"url ="],
              ".htpasswd":          [b":"],
              "config.php":         [b"$db_pass", b"$password", b"mysql_connect"],
              "wp-config.php":      [b"DB_PASSWORD", b"AUTH_KEY", b"table_prefix"],
              ".npmrc":             [b"_authToken", b"registry="],
              "id_rsa":             [b"BEGIN OPENSSH PRIVATE KEY", b"BEGIN RSA PRIVATE KEY"],
              "docker-compose.yml": [b"services:", b"image:"],
          }

          FETCH_TIMEOUT = 8
          FETCH_DELAY = 0.15
          MAX_FETCHES = 300


          def norm_path(u):
              return (urllib.parse.urlparse(u).path.rstrip("/") or "/")


          def normalise(raw, path):
              t = raw[:8192].decode("utf-8", "ignore")
              t = t.replace(path, "")
              t = re.sub(r"[0-9a-fA-F]{16,}", "", t)
              t = re.sub(r"\d+", "N", t)
              return re.sub(r"\s+", " ", t).strip().lower()


          def get(url):
              """(status, ctype, body_bytes) — redirects NOT followed, matching ffuf."""
              try:
                  req = urllib.request.Request(url, headers=INTIGRITI)
                  with OPENER.open(req, timeout=FETCH_TIMEOUT) as r:
                      return (r.status,
                              r.headers.get("Content-Type", "").split(";")[0],
                              r.read(8192))
              except urllib.error.HTTPError as e:
                  ct = e.headers.get("Content-Type", "").split(";")[0] if e.headers else ""
                  return e.code, ct, (e.read(8192) if e.fp else b"")
              except Exception:
                  return None, "", b""


          def basename(url):
              return os.path.basename(urllib.parse.unquote(urllib.parse.urlparse(url).path)).lower()


          def is_sensitive(url):
              b = basename(url)
              if b in MARKERS or b == ".gitignore":
                  return True
              if b.endswith((".env", ".htpasswd", ".npmrc")):
                  return True
              return b.endswith((".bak", ".old", ".orig", ".save", ".swp",
                                 ".sql", ".zip", ".gz", ".tar"))


          def markers_for(b):
              if b in MARKERS:
                  return MARKERS[b]
              for suffix, mk in MARKERS.items():        # e.g. prod.env -> .env markers
                  if suffix.startswith(".") and b.endswith(suffix):
                      return mk
              return None


          def valid_sensitive(url, ct, body):
              b = basename(url)
              if b == ".gitignore":
                  return ct not in CT_BLOCK and b"<html" not in body[:256].lower() and len(body) > 0
              if ct in CT_BLOCK:
                  return False          # a config/secret served as HTML is an error page
              if body[:4] in (b"PK\x03\x04", b"%PDF") or body[:2] == b"\x1f\x8b":
                  return True           # archive / pdf with correct magic bytes
              markers = markers_for(b)
              if markers:
                  return any(m in body for m in markers)
              return len(body) > 32     # unknown sensitive extension: non-trivial body


          current, authgated, noise = [], [], []
          suspects = []
          seen = set()
          stats = Counter()
          baselines = {h: set(v.get("baseline", [])) for h, v in canaries.items()}

          for path in sorted(glob.glob("results/ffuf_tmp/*.json")):
              try:
                  with open(path) as f:
                      data = json.load(f)
              except Exception:
                  continue

              stats["hosts"] += 1
              host_url = (data.get("config", {}).get("url") or "").replace("/FUZZ", "").rstrip("/")
              results = data.get("results", []) or []
              stats["raw"] += len(results)

              if len(results) > THRESHOLD:
                  suspects.append(f"{host_url} — {len(results)}/{WORDLIST_SIZE} matched")

              for r in results:
                  url = r.get("url", "")
                  status = r.get("status", 0)
                  redirect = r.get("redirectlocation", "") or ""
                  if not url:
                      continue

                  # [19] auth / deny responses are context, never findings
                  if status in (401, 403):
                      authgated.append(f"{url} [{status}]")
                      continue

                  # [19] canonicalise redirects
                  if status in (301, 302, 303, 307, 308):
                      if not redirect:
                          noise.append(f"{url} [{status}] (no Location)")
                          continue
                      target = urllib.parse.urljoin(url, redirect)
                      if urllib.parse.urlparse(target).netloc != urllib.parse.urlparse(url).netloc:
                          noise.append(f"{url} [{status}] -> {redirect} (cross-host)")
                          stats["crosshost"] += 1
                          continue
                      if norm_path(target) == norm_path(url):
                          noise.append(f"{url} [{status}] -> {redirect} (slash-only)")
                          stats["slashonly"] += 1
                          continue
                      if REDIRECT_LOGIN_RE.search(urllib.parse.urlparse(target).path):
                          authgated.append(f"{url} [{status}] -> {redirect} (auth wall)")
                          stats["authwall"] += 1
                          continue
                      line = f"{url} [{status}] -> {redirect}"
                      if line not in seen:
                          seen.add(line)
                          current.append(line)
                      continue

                  if not (200 <= status < 300):
                      noise.append(f"{url} [{status}]")
                      continue

                  # [18][20][21] fetch once, then apply the evidence gate
                  if stats["fetches"] >= MAX_FETCHES:
                      noise.append(f"{url} [{status}] (unverified: fetch cap)")
                      stats["unverified"] += 1
                      continue

                  st, ct, body = get(url)
                  stats["fetches"] += 1
                  time.sleep(FETCH_DELAY)

                  if st is None:
                      noise.append(f"{url} [{status}] (unverified: fetch failed)")
                      stats["unverified"] += 1
                      continue

                  fp = (f"{status}|{ct}|"
                        f"{hashlib.sha256(normalise(body, urllib.parse.urlparse(url).path).encode()).hexdigest()[:16]}")
                  if fp in baselines.get(host_url, set()):
                      noise.append(f"{url} [{status}] (matches canary baseline)")
                      stats["baseline"] += 1
                      continue

                  if LOGIN_FORM_RE.search(body.decode("utf-8", "ignore")):
                      authgated.append(f"{url} [{status}] (login form)")
                      stats["authwall"] += 1
                      continue

                  if is_sensitive(url) and not valid_sensitive(url, ct, body):
                      noise.append(f"{url} [{status}] (sensitive path failed content validation)")
                      stats["sensitive_dropped"] += 1
                      continue

                  if NOISE_RE.search(url):
                      stats["noise"] += 1
                      continue

                  key = (urllib.parse.urlparse(url).netloc, norm_path(url))
                  line = f"{url} [{status}]"
                  if key not in seen:
                      seen.add(key)
                      current.append(line)

          outputs = (("ffuf_current_raw.txt", current),
                     ("ffuf_current.txt", current),
                     ("ffuf_authgated.txt", authgated),
                     ("ffuf_filtered_noise.txt", noise),
                     ("ffuf_suspect_hosts.txt", suspects),
                     ("waf_deny.txt", []))
          for name, rows in outputs:
              with open("results/" + name, "w") as out:
                  out.write("\n".join(sorted(set(rows))) + ("\n" if rows else ""))

          print(f"Hosts fuzzed: {stats['hosts']}   raw hits: {stats['raw']}")
          print(f"  dropped slash-only redirects : {stats['slashonly']}")
          print(f"  dropped cross-host redirects : {stats['crosshost']}")
          print(f"  dropped canary-baseline      : {stats['baseline']}")
          print(f"  dropped auth walls           : {stats['authwall']}")
          print(f"  dropped sensitive-invalid    : {stats['sensitive_dropped']}")
          print(f"  unverified (fail-closed)     : {stats['unverified']}")
          print(f"  kept as findings             : {len(current)}")
          print(f"  auth-gated (context only)    : {len(authgated)}")
          print(f"  written to noise             : {len(noise)}")
          if suspects:
              print("Suspect catch-all hosts (over 60% wordlist match):")
              for s in suspects:
                  print(f"  {s}")
          PYEOF

      - name: Diff ffuf findings against previous run
        id: ffuf_diff
        run: |
          if [ -f results/ffuf_previous.txt ]; then
            comm -13 results/ffuf_previous.txt results/ffuf_current.txt > results/ffuf_new.txt
          else
            cp results/ffuf_current.txt results/ffuf_new.txt
          fi
          NEW_PATHS=$(wc -l < results/ffuf_new.txt | tr -d ' ')
          echo "new_paths=$NEW_PATHS" >> "$GITHUB_OUTPUT"

      - name: Capture server headers for confirmed findings (delta, every run)
        if: steps.ffuf_diff.outputs.new_paths != '0'
        run: |
          # [1] program headers on every curl
          > results/findings_with_headers.txt
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            url=$(echo "$line" | awk '{print $1}')
            echo "=== $url ===" >> results/findings_with_headers.txt
            curl -sI --max-time 8 \
              -A "$INTIGRITI_UA" \
              -H "X-Intigriti-Username: $INTIGRITI_H" \
              "$url" | grep -iE \
              "server:|x-powered-by:|x-aspnet-version:|x-generator:|via:|x-backend:" \
              >> results/findings_with_headers.txt 2>/dev/null || true
            echo "$line" >> results/findings_with_headers.txt
            echo "" >> results/findings_with_headers.txt
          done < results/ffuf_new.txt

      - name: Capture server headers for full backlog (weekly Sunday 00:00 UTC, or manual test dispatch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — bypassing weekly day/hour guard (test mode)"
          else
            DAY=$(date -u +%u)
            HOUR=$((10#$(date -u +%H)))
            if [ "$DAY" != "7" ] || [ "$HOUR" -gt 2 ]; then
              echo "Not the weekly slot (Sunday 00:00 UTC) — skipping full-backlog header capture"
              exit 0
            fi
            echo "Weekly slot confirmed — running full-backlog header capture"
          fi

          if [ ! -s results/ffuf_current.txt ]; then
            echo "No confirmed ffuf findings to capture headers for"
            touch results/findings_with_headers_full.txt
            exit 0
          fi

          > results/findings_with_headers_full.txt
          TOTAL=$(wc -l < results/ffuf_current.txt | tr -d ' ')
          echo "Capturing headers for all $TOTAL confirmed findings..."
          COUNT=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            COUNT=$((COUNT+1))
            url=$(echo "$line" | awk '{print $1}')
            echo "=== $url ===" >> results/findings_with_headers_full.txt
            curl -sI --max-time 8 \
              -A "$INTIGRITI_UA" \
              -H "X-Intigriti-Username: $INTIGRITI_H" \
              "$url" | grep -iE \
              "server:|x-powered-by:|x-aspnet-version:|x-generator:|via:|x-backend:" \
              >> results/findings_with_headers_full.txt 2>/dev/null || true
            echo "$line" >> results/findings_with_headers_full.txt
            echo "" >> results/findings_with_headers_full.txt
          done < results/ffuf_current.txt

          echo "Full-backlog header capture complete: $COUNT findings, $(wc -l < results/findings_with_headers_full.txt) lines written"

      - name: AI-triage ffuf and bypass findings
        id: ffuf_triage
        if: steps.ffuf_diff.outputs.new_paths != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_API_KEY_2: ${{ secrets.COHERE_API_KEY_2 }}
          COHERE_API_KEY_3: ${{ secrets.COHERE_API_KEY_3 }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          FINDINGS=$(head -n 80 results/ffuf_new.txt)
          INSTRUCTIONS=$(printf "You are triaging raw ffuf directory bruteforce results for the Citymesh responsible-disclosure program. Each line is 'url [status_code]'. Separate into:\nPRIORITY (manually verify immediately): .git/, .env, web.config, .htpasswd, phpMyAdmin (pma), admin panels, backup files (.bak/.old/.zip/.sql), API endpoints returning 200, exposed config files, management interfaces.\nINVESTIGATE: health endpoints, vendor/, cgi-bin/, staging subdomains, 401/403 paths suggesting auth-gated content.\nNOISE (skip): favicon.ico, .well-known/* (acme-challenge, pki-validation, http-opportunistic), /blocked, /maintenance, /assets returning 301, static files on CDN hosts. ALSO never treat as findings: 30x redirects into login/auth pages (auth wall, not a leak), OPTIONS/204 preflight responses, and Cloudflare challenge pages (Just a moment).\nHARD RULES: a 301/302/401/403, a redirect into a login page, a canary/baseline match, or content that failed validation is NEVER a finding — classify it NON-REPORTABLE. If the only evidence is a status code, do not invent impact from the filename; only claim a config/secret leak when the actual sensitive bytes appear in the evidence.\nBe concise. Plain text. End with TOP PRIORITY: listing the 1-3 URLs to curl manually first.")
          PROMPT_TEXT=$(printf "%s\n\nFINDINGS:\n%s" "$INSTRUCTIONS" "$FINDINGS")
          SUMMARY=""
          PROVIDER="none"

          for KEY_VAR in GEMINI_API_KEY GEMINI_API_KEY_2 GEMINI_API_KEY_3; do
            KEY_VAL="${!KEY_VAR}"
            [ -z "$KEY_VAL" ] && continue
            GEMINI_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" '{contents: [{parts: [{text: $text}]}]}')
            GEMINI_RESPONSE=$(curl -s -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=$KEY_VAL" \
              -H "Content-Type: application/json" -d "$GEMINI_PAYLOAD")
            SUMMARY=$(echo "$GEMINI_RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null || echo "")
            if [ -n "$SUMMARY" ]; then PROVIDER="Gemini ($KEY_VAR)"; break; fi
          done

          # Tier 2: DeepSeek — deepseek-flash (only live model name; chat/reasoner aliases retired 2026-07)
          if [ -z "$SUMMARY" ]; then
            if [ -n "$DEEPSEEK_API_KEY" ]; then
              DEEPSEEK_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" \
                '{model: "deepseek-flash", messages: [{role: "user", content: $text}]}')
              DEEPSEEK_RESPONSE=$(curl -s -X POST "https://api.deepseek.com/v1/chat/completions" \
                -H "Content-Type: application/json" -H "Authorization: Bearer $DEEPSEEK_API_KEY" -d "$DEEPSEEK_PAYLOAD")
              SUMMARY=$(echo "$DEEPSEEK_RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || echo "")
              if [ -n "$SUMMARY" ]; then PROVIDER="DeepSeek (deepseek-flash, tier-2)"; else echo "DeepSeek failed: $DEEPSEEK_RESPONSE"; fi
            fi
          fi

          if [ -z "$SUMMARY" ]; then
            for KEY_VAR in COHERE_API_KEY COHERE_API_KEY_2 COHERE_API_KEY_3; do
              KEY_VAL="${!KEY_VAR}"
              [ -z "$KEY_VAL" ] && continue
              COHERE_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" \
                '{model: "command-a-03-2025", messages: [{role: "user", content: $text}]}')
              COHERE_RESPONSE=$(curl -s -X POST "https://api.cohere.com/v2/chat" \
                -H "Content-Type: application/json" -H "Authorization: Bearer $KEY_VAL" -d "$COHERE_PAYLOAD")
              SUMMARY=$(echo "$COHERE_RESPONSE" | jq -r '.message.content[0].text // empty' 2>/dev/null || echo "")
              if [ -n "$SUMMARY" ]; then PROVIDER="Cohere ($KEY_VAR, fallback)"; break; fi
            done
          fi

          if [ -z "$SUMMARY" ]; then
            SUMMARY=$(printf "AI unavailable — raw findings:\n%s" "$FINDINGS")
          fi

          echo "$SUMMARY" > results/ffuf_ai_summary.txt
          echo "triage_provider=$PROVIDER" >> "$GITHUB_OUTPUT"

      - name: Notify Discord if new paths found
        if: steps.ffuf_diff.outputs.new_paths != '0'
        run: |
          SUMMARY=$(head -c 1700 results/ffuf_ai_summary.txt)
          CONTENT=$(printf "**New ffuf findings — AI-triaged (Citymesh):**\n\`\`\`\n%s\n\`\`\`" "$SUMMARY")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Notify Discord if any host looks like a soft-404 false-positive source
        if: hashFiles('results/ffuf_suspect_hosts.txt') != ''
        run: |
          if [ -s results/ffuf_suspect_hosts.txt ]; then
            SUSPECTS=$(cat results/ffuf_suspect_hosts.txt)
            CONTENT=$(printf "**Warning: possible soft-404 false positives (Citymesh ffuf run):**\nThese hosts matched over 60%% of the wordlist — likely a catch-all page, not real paths. Treat their findings as unreliable until manually checked.\n\`\`\`\n%s\n\`\`\`" "$SUSPECTS")
            PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
            curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
          fi

      - name: Attempt 403 bypass on restricted paths found
        run: |
          # Only probes paths ffuf already flagged as 401/403. Read-only methods only.
          # FIXES vs. original:
          #  [1] Intigriti headers on every request
          #  [4] redirects no longer followed automatically — a 30x is never "evidence";
          #      OPTIONS dropped (a 204 preflight is gateway boilerplate, not a bypass);
          #      2xx evidence requires a non-empty body
          #  [5] variants redirecting into login/auth surfaces are classified auth-gated
          #  [6] Cloudflare challenge responses are recognized and suppressed
          #  [7] canary catch-all fingerprint check added to bypass validation
          cat > bypass_check.py << 'PYEOF'
          import urllib.request, urllib.error, http.client, urllib.parse, time, json, os, re, hashlib

          TIMEOUT = 8
          DELAY = 0.3

          INTIGRITI = {
              "User-Agent": os.environ.get("INTIGRITI_UA", "Intigriti-VDP-SubdomainMonitor/1.0"),
              "X-Intigriti-Username": os.environ.get("INTIGRITI_H", ""),
          }

          # [4] OPTIONS removed — its 204 is a CORS preflight, meaningless as bypass evidence
          SAFE_METHODS = ["TRACE", "PROPFIND", "SEARCH"]

          # [5] redirects into an auth surface are walls, not clairvoyant bypasses
          REDIRECT_LOGIN_RE = re.compile(r"login|signin|sign-in|register|/Account/(Login|Register)|/auth", re.I)

          # [16] WAF-deny fingerprints (Cloudflare block pages, not app errors):
          # a 403 carrying one of these is the WAF denying the request pattern —
          # it proves the WAF works, never that the blocked file exists.
          WAF_RE = re.compile(r"cloudflare|Attention Required|error code: 1\d\d\d|__cf_|cf-ray", re.I)

          try:
              with open("results/canary_signatures.json") as f:
                  CANARIES = json.load(f)
          except Exception:
              CANARIES = {}


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          OPENER = urllib.request.build_opener(NoRedirect)


          def request_with_body(url, method="GET", headers=None, timeout=TIMEOUT):
              """(status, content_type, body) — redirects NEVER followed."""
              hdrs = dict(INTIGRITI)
              if headers:
                  hdrs.update(headers)
              try:
                  req = urllib.request.Request(url, method=method, headers=hdrs)
                  with OPENER.open(req, timeout=timeout) as r:
                      ct = r.headers.get("Content-Type", "")
                      # 8192 to match the canary baseline window exactly — the
                      # fingerprint compare below is only valid for equal-size reads.
                      body = r.read(8192).decode("utf-8", "ignore")
                      return r.status, ct, body
              except urllib.error.HTTPError as e:
                  ct = e.headers.get("Content-Type", "") if e.headers else ""
                  body = e.read(8192).decode("utf-8", "ignore") if e.fp else ""
                  # [6] Cloudflare challenge — report it distinctly so caller can suppress
                  if (e.code == 403 and (e.headers.get("cf-mitigated") == "challenge"
                          or "Just a moment" in body or "challenge-platform" in body)):
                      return "cf-challenge", ct, body
                  # [16] WAF deny (block page, not challenge) — also suppressed
                  if e.code == 403 and WAF_RE.search(body):
                      return "waf-deny", ct, body
                  return e.code, ct, body
              except Exception:
                  return None, "", ""


          def http10_status(url, timeout=TIMEOUT):
              try:
                  parsed = urllib.parse.urlparse(url)
                  conn_cls = http.client.HTTPSConnection if parsed.scheme == "https" else http.client.HTTPConnection
                  port = parsed.port or (443 if parsed.scheme == "https" else 80)
                  conn = conn_cls(parsed.hostname, port, timeout=timeout)
                  conn._http_vsn = 10
                  conn._http_vsn_str = "HTTP/1.0"
                  path = parsed.path or "/"
                  if parsed.query:
                      path += "?" + parsed.query
                  conn.request("GET", path, headers=dict(INTIGRITI))
                  resp = conn.getresponse()
                  status = resp.status
                  conn.close()
                  return status
              except Exception:
                  return None


          def wayback_snapshot(url):
              # passive-only — zero requests to the target
              try:
                  api = "https://archive.org/wayback/available?url=" + urllib.parse.quote(url, safe="")
                  req = urllib.request.Request(api, headers=INTIGRITI)
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                      data = json.loads(r.read().decode("utf-8", "ignore"))
                  snap = (data.get("archived_snapshots") or {}).get("closest")
                  if snap and snap.get("available"):
                      return snap.get("url")
              except Exception:
                  pass
              return None


          def split_url(url):
              scheme_sep = url.find("://") + 3
              host_end = url.find("/", scheme_sep)
              if host_end == -1:
                  return url, "/"
              return url[:host_end], url[host_end:]


          def build_path_variants(url):
              base, path = split_url(url)
              if not path.startswith("/"):
                  path = "/" + path
              trimmed = path.rstrip("/")
              last_seg = trimmed.rsplit("/", 1)[-1] if trimmed else ""
              parent = trimmed[: -len(last_seg)] if last_seg else trimmed

              variants = [
                  path + "/",
                  path.rstrip("/"),
                  trimmed + ".",
                  trimmed + "%20",
                  trimmed + "%2e",
                  "/%2e%2e" + trimmed,
                  "/%2e%2e%2f" + last_seg if last_seg else path,
                  "/%2e%2e/%2e%2e" + trimmed,
                  trimmed + "%2f",
                  trimmed.replace("/", "//", 1),
                  trimmed + "%252f",
                  parent + "..;/" + last_seg if last_seg else path,
                  "/..;" + trimmed,
                  trimmed + "%c0%af",
                  trimmed + "%ef%bc%8f",
                  trimmed + "%00.html",
                  trimmed + "%00.json",
              ]

              for ext in [".json", ".html", ".php", ".bak", ".old"]:
                  variants.append(trimmed + ext)

              if last_seg:
                  for cased in {last_seg.upper(), last_seg.lower(), last_seg.swapcase()}:
                      if cased != last_seg:
                          variants.append(parent + cased)

              for param in ["unused_param=1", "debug=true", "access=granted", "redirect=allowed"]:
                  variants.append(path + "?" + param)

              seen = set()
              out = []
              for v in variants:
                  full = base + v if not v.startswith("http") else v
                  if full not in seen:
                      seen.add(full)
                      out.append(full)
              return base, path, out


          def build_header_variants(url):
              _, path = split_url(url)
              return [
                  {"X-Original-URL": path},
                  {"X-Rewrite-URL": path},
                  {"X-Forwarded-For": "127.0.0.1"},
                  {"X-Forwarded-Host": "127.0.0.1"},
                  {"X-Custom-IP-Authorization": "127.0.0.1"},
                  {"X-Client-IP": "127.0.0.1"},
                  {"True-Client-IP": "127.0.0.1"},
                  {"X-Real-IP": "127.0.0.1"},
                  {"X-Host": "localhost"},
                  {"Referer": url},
              ]


          SENSITIVE_PATHS = {
              "web.config":  ["connectionString", "password", "apiKey", "secret", "credentials"],
              ".env":        ["DB_PASSWORD", "SECRET_KEY", "API_KEY", "TOKEN", "AWS_"],
              ".git/HEAD":   ["ref: refs/", "HEAD detached"],
              ".git/config": ["[core]", "[remote", "url ="],
              ".htpasswd":   [":"],
              "config.php":  ["$db_pass", "$password", "mysql_connect"],
          }


          def validate_bypass_response(url, response_body, content_type):
              non_html_paths = [".gz", ".tar", ".zip", ".sql", ".bak", ".json", ".xml", ".env"]
              path = urllib.parse.urlparse(url).path.lower()
              if any(path.endswith(ext) for ext in non_html_paths):
                  if "text/html" in content_type:
                      return False

              spa_markers = [
                  "<div id=\"app\">",
                  "<div id=\"spinner\"",
                  "chunk-vendors",
                  "has-spinner-active",
              ]
              return not any(marker in response_body for marker in spa_markers)


          def validate_sensitive_content(url, body_text):
              path = urllib.parse.urlparse(url).path.lstrip("/")
              for sensitive_path, keywords in SENSITIVE_PATHS.items():
                  if path.endswith(sensitive_path):
                      return any(kw in body_text for kw in keywords)
              return True


          def canary_matches(host_base, status, content_type, body_text, path):
              """[18] fingerprint the response against the host's no-redirect canary baseline."""
              c = CANARIES.get(host_base)
              if not c:
                  return False
              base = set(c.get("baseline", []))
              if not base:
                  return False
              t = (body_text or "")[:8192].replace(path or "", "")
              t = re.sub(r"[0-9a-fA-F]{16,}", "", t)
              t = re.sub(r"\d+", "N", t)
              t = re.sub(r"\s+", " ", t).strip().lower()
              ct = (content_type or "").split(";")[0]
              fp = f"{status}|{ct}|{hashlib.sha256(t.encode()).hexdigest()[:16]}"
              return fp in base


          def host_base_of(url):
              base, _ = split_url(url)
              return base


          def is_real_bypass(bypass_url, original_url, status, content_type, body):
              if status == 204:            # preflight, no body — never evidence
                  return False
              if not body:
                  return False
              if canary_matches(host_base_of(bypass_url), status, content_type, body,
                                urllib.parse.urlparse(bypass_url).path):
                  return False
              # [16] WAF deny body slipped through a 200 spoof variant — still not evidence
              if status == 403 and WAF_RE.search(body):
                  return False
              if not validate_bypass_response(bypass_url, body, content_type):
                  return False
              orig_path = urllib.parse.urlparse(original_url).path.lstrip("/")
              for sensitive_path in SENSITIVE_PATHS:
                  if orig_path.endswith(sensitive_path):
                      return validate_sensitive_content(original_url, body)
              return True


          def redirect_is_auth_wall(location):
              return bool(location and REDIRECT_LOGIN_RE.search(location))


          bypass_findings = []
          suppressed = []


          def try_target_full(url):
                  # 1) header spoofing
                  for hdrs in build_header_variants(url):
                      status, ct, body = request_with_body(url, method="GET", headers=hdrs)
                      time.sleep(DELAY)
                      if status == "cf-challenge":
                          return None, "challenge"
                      if status == "waf-deny":
                          return None, "waf"
                      if isinstance(status, int) and 200 <= status < 300:
                          if is_real_bypass(url, url, status, ct, body):
                              hdr_str = ", ".join(f"{k}: {v}" for k, v in hdrs.items())
                              return f"{url} -> bypass via header [{hdr_str}] returned {status}", None
                      if status and 300 <= status < 400:
                          # fetch location via raw connect: reuse a HEAD-ish snapshot
                          pass  # redirect evidence never counts (fix [4])

                  # 2) path encoding / case / extension / query tricks
                  base, path, variants = build_path_variants(url)
                  for variant_url in variants:
                      status, ct, body = request_with_body(variant_url, method="GET")
                      time.sleep(DELAY)
                      if status == "cf-challenge":
                          return None, "challenge"
                      if status == "waf-deny":
                          return None, "waf"
                      if isinstance(status, int) and 200 <= status < 300:
                          if is_real_bypass(variant_url, url, status, ct, body):
                              return f"{url} -> bypass via path variant '{variant_url}' returned {status}", None

                  # 3) safe read-only method tampering (no OPTIONS — preflight 204 is noise)
                  for method in SAFE_METHODS:
                      status, ct, body = request_with_body(url, method=method)
                      time.sleep(DELAY)
                      if status == "cf-challenge":
                          return None, "challenge"
                      if status == "waf-deny":
                          return None, "waf"
                      if isinstance(status, int) and 200 <= status < 300:
                          if is_real_bypass(url, url, status, ct, body):
                              return f"{url} -> bypass via method {method} returned {status}", None

                  # 4) scheme downgrade (https -> http)
                  if url.startswith("https://"):
                      http_url = "http://" + url[len("https://"):]
                      status, ct, body = request_with_body(http_url, method="GET")
                      time.sleep(DELAY)
                      if status == "cf-challenge":
                          return None, "challenge"
                      if status == "waf-deny":
                          return None, "waf"
                      if isinstance(status, int) and 200 <= status < 300:
                          if is_real_bypass(http_url, url, status, ct, body):
                              return f"{url} -> bypass via HTTP downgrade '{http_url}' returned {status}", None

                  # 5) HTTP/1.0 downgrade
                  code = http10_status(url)
                  time.sleep(DELAY)
                  if isinstance(code, int) and 200 <= code < 300:
                      # 1.0 capture has no body; re-fetch normally so body checks apply.
                      # Only claim the bypass if the NORMAL-stack response is NOT a 200
                      # with real content (otherwise it's not the 1.0 doing the work).
                      status2, ct2, body2 = request_with_body(url, method="GET")
                      normal_ok = isinstance(status2, int) and status2 == 200 and is_real_bypass(url, url, 200, ct2, body2)
                      if not normal_ok:
                          return f"{url} -> bypass via HTTP/1.0 downgrade returned {code}", None

                  # 6) passive Wayback snapshot
                  snap = wayback_snapshot(url)
                  if snap:
                      return f"{url} -> historical snapshot available on Wayback Machine: {snap}", None

                  return None, None


          def main():
              # [19] 401/403 live in ffuf_authgated.txt now (never in ffuf_current.txt —
              # those are evidence-validated 2xx/redirects only). Only probe the plain
              # "url [401]" / "url [403]" lines; skip annotated auth-wall lines.
              try:
                  with open("results/ffuf_authgated.txt") as f:
                      lines = [l.strip() for l in f if l.strip()]
              except FileNotFoundError:
                  lines = []

              targets = []
              for line in lines:
                  if line.endswith("[401]") or line.endswith("[403]"):
                      targets.append(line.rsplit(" [", 1)[0])
              targets = targets[:20]

              for url in targets:
                  result, tag = try_target_full(url)
                  if result:
                      bypass_findings.append(result)
                  elif tag == "challenge":
                      suppressed.append(f"{url} (Cloudflare challenge — suppressed)")
                  elif tag == "waf":
                      suppressed.append(f"{url} (WAF deny page — [16] suppressed)")

              with open("results/bypass_current.txt", "w") as out:
                  for f_ in sorted(set(bypass_findings)):
                      out.write(f_ + "\n")

              with open("results/bypass_suppressed.txt", "w") as out:
                  for s in sorted(set(suppressed)):
                      out.write(s + "\n")

          try:
              main()
          except Exception as exc:
              # keep partial results rather than failing the whole run
              with open("results/bypass_current.txt", "w") as out:
                  pass
              print(f"bypass stage error: {exc!r}")
          PYEOF

          python3 bypass_check.py
          sort -u results/bypass_current.txt -o results/bypass_current.txt 2>/dev/null || touch results/bypass_current.txt

      - name: Diff 403 bypass findings against previous run
        id: bypass_diff
        run: |
          if [ -f results/bypass_previous.txt ]; then
            comm -13 results/bypass_previous.txt results/bypass_current.txt > results/bypass_new.txt
          else
            cp results/bypass_current.txt results/bypass_new.txt
          fi
          NEW_BYPASSES=$(wc -l < results/bypass_new.txt | tr -d ' ')
          echo "new_bypasses=$NEW_BYPASSES" >> "$GITHUB_OUTPUT"

      - name: Notify Discord if new 403 bypass found
        if: steps.bypass_diff.outputs.new_bypasses != '0'
        run: |
          BYPASSES=$(head -c 1700 results/bypass_new.txt)
          CONTENT=$(printf "**403 bypass succeeded (Citymesh) — verify manually, do not report until body-validated:**\n\`\`\`\n%s\n\`\`\`" "$BYPASSES")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Extract JS URLs from discovered pages + katana crawl
        run: |
          mkdir -p results

          # candidate pages from ffuf-discovered URLs, deduped + static-asset filtered
          jq -r '.results[]?.url // empty' results/ffuf_tmp/*.json 2>/dev/null \
            | sort -u \
            | grep -viE '\.(png|jpg|jpeg|gif|svg|ico|webp|bmp|tiff|css|woff|woff2|ttf|otf|eot|mp4|webm|mp3|wav|pdf|zip|tar|gz|tgz|rar|7z|exe|dmg|iso|bin)(\?|$)' \
            > results/js_candidate_pages.txt || true

          TOTAL_CANDIDATES=$(wc -l < results/js_candidate_pages.txt | tr -d ' ')
          MAX_FETCH=200
          echo "JS extraction: $TOTAL_CANDIDATES candidate page(s), fetch cap $MAX_FETCH"

          > results/js_from_html.txt
          COUNT=0
          FETCHED=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            COUNT=$((COUNT+1))
            if [ "$COUNT" -gt "$MAX_FETCH" ]; then
              echo "Fetch cap ($MAX_FETCH) reached, stopping HTML extraction"
              break
            fi

            # [1] program headers
            BODY=$(curl -s --max-time 8 \
              -A "$INTIGRITI_UA" -H "X-Intigriti-Username: $INTIGRITI_H" \
              "$url" 2>/dev/null || true)
            sleep 0.15
            [ -z "$BODY" ] && continue

            BODY=$(printf '%s' "$BODY" | head -c 262144)
            FETCHED=$((FETCHED+1))

            ORIGIN=$(printf '%s' "$url" | grep -oE '^https?://[^/]+')

            printf '%s' "$BODY" \
              | grep -oE '(src|href)=[^ >]*\.js[^ >]*' 2>/dev/null \
              | sed -E 's/^(src|href)=//' \
              | tr -d '"' | tr -d "'" \
              | while IFS= read -r js_path; do
                  [ -z "$js_path" ] && continue
                  case "$js_path" in
                    http://*|https://*) printf '%s\n' "$js_path" ;;
                    //*)                printf 'https:%s\n' "$js_path" ;;
                    /*)                 printf '%s%s\n' "$ORIGIN" "$js_path" ;;
                    *)                  printf '%s/%s\n' "$ORIGIN" "$js_path" ;;
                  esac
                done >> results/js_from_html.txt
          done < results/js_candidate_pages.txt

          echo "Fetched $FETCHED page(s), extracted $(wc -l < results/js_from_html.txt) JS ref(s) from HTML"

          # katana safety net — [1] program headers
          katana -list results/current_alive_hosts.txt \
                 -jc -silent -rate-limit 10 -depth 2 \
                 -H "X-Intigriti-Username: $INTIGRITI_H" \
                 -a "$INTIGRITI_UA" \
            | grep -E '\.js($|\?)' >> results/js_from_html.txt || true

          sort -u results/js_from_html.txt > results/js_urls_current.txt
          echo "Total JS URLs to scan: $(wc -l < results/js_urls_current.txt)"

      - name: Download JS files and scan for secrets
        run: |
          mkdir -p js_files
          > results/js_secrets_current.txt
          > results/js_hashes_current.txt

          PATTERN="(AKIA[0-9A-Z]{16})|(AIza[0-9A-Za-z_-]{35})|(xox[baprs]-[0-9A-Za-z-]{10,})|(eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})|(-----BEGIN [A-Z ]*PRIVATE KEY-----)|([Aa]pi[_-]?[Kk]ey.{0,3}[:=].{0,3}[A-Za-z0-9_-]{16,})"

          COUNT=0
          while IFS= read -r jsurl; do
            [ -z "$jsurl" ] && continue
            COUNT=$((COUNT+1))
            if [ "$COUNT" -gt 100 ]; then
              echo "JS file cap (100) reached, stopping"
              break
            fi
            FNAME="js_files/$(echo "$jsurl" | sha1sum | cut -d' ' -f1).js"
            # [1] program headers
            curl -s --max-time 10 \
              -A "$INTIGRITI_UA" -H "X-Intigriti-Username: $INTIGRITI_H" \
              -o "$FNAME" "$jsurl" || continue
            # [17] record content hash for bundle-drift detection and dedupe
            echo "$(sha1sum "$FNAME" | cut -d' ' -f1)|$jsurl" >> results/js_hashes_current.txt
            MATCHES=$(grep -E -o "$PATTERN" "$FNAME" 2>/dev/null | sort -u || true)
            if [ -n "$MATCHES" ]; then
              while IFS= read -r m; do
                echo "$jsurl | $m" >> results/js_secrets_current.txt
              done <<< "$MATCHES"
            fi
          done < results/js_urls_current.txt
          sort -u results/js_secrets_current.txt -o results/js_secrets_current.txt

      - name: JS deep analysis (source maps, endpoints, bundle drift)
        run: |
          # [17] extends the regex secret scan with three zero-adjacent-request passes:
          #  (a) source-map exposure: fetch "<js>.map" (cap 100, 0.15s pacing) and
          #      run the SAME secret pattern over the decoded map.
          #  (b) endpoint mining (passive, no requests): linkfinder-style extraction
          #      of fetch/axios-style API paths from the already-downloaded bundles.
          #  (c) bundle-drift alert: a JS URL whose content hash changed since the
          #      previous run (new code = rescan target) via js_hashes_previous.txt.
          python3 - << 'PYEOF'
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error

          INTIGRITI = {
              "User-Agent": os.environ.get("INTIGRITI_UA", "Intigriti-VDP-SubdomainMonitor/1.0"),
              "X-Intigriti-Username": os.environ.get("INTIGRITI_H", ""),
          }

          MAP_MARKERS = ('"sourceRoot"', '"sources"', '"sourcesContent"')
          SECRET_RE = re.compile(
              r"(AKIA[0-9A-Z]{16})|(AIza[0-9A-Za-z_-]{35})|(xox[baprs]-[0-9A-Za-z-]{10,})"
              r"|(eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})"
              r"|(-----BEGIN [A-Z ]*PRIVATE KEY-----)"
              r"|([Aa]pi[_-]?[Kk]ey.{0,3}[:=].{0,3}[A-Za-z0-9_-]{16,})"
          )
          # linkfinder-lite: strings that look like intra-app API routes (query-capable)
          ENDPOINT_RE = re.compile(r"['\"(](/[A-Za-z0-9_\-./]{2,80}\??[A-Za-z0-9_=&%-]{0,60})['\")/]")
          ENDPOINT_JUNK = re.compile(
              r"^/(favicon|robots|Content/|content/|Scripts/|scripts/|Themes/|themes/|assets/|img|images|static/|_next/|node_modules|dist/|vendor/|bundles/|fonts|.*\.(png|jpe?g|gif|svg|css|woff2?|ttf|eot|ico|webp))", re.I)

          # ---- hash -> url mapping written by the download step ----
          url_by_hash = {}
          hash_lines = []
          if os.path.exists("results/js_hashes_current.txt"):
              for l in open("results/js_hashes_current.txt"):
                  if "|" in l:
                      h, u = l.strip().split("|", 1)
                      hash_lines.append((h, u))
                      url_by_hash.setdefault(h, u)

          # ---------- (b) passive endpoint mining (no network) ----------
          endpoints = set()
          for h, u in hash_lines:
              fn = f"js_files/{h}.js"
              try:
                  text = open(fn, encoding="utf-8", errors="ignore").read()[:2_000_000]
              except OSError:
                  continue
              for m in ENDPOINT_RE.findall(text):
                  e = m[0] if isinstance(m, tuple) else m
                  if e.startswith("/") and not ENDPOINT_JUNK.match(e) and "/" in e[1:]:
                      endpoints.add(f"{u}|{e}")
          with open("results/js_endpoints_current.txt", "w") as out:
              for line in sorted(endpoints):
                  out.write(line + "\n")
          print(f"[17b] API-style endpoints mined from JS: {len(endpoints)}")

          # ---------- (a) source-map discovery + same secret pattern ----------
          sourcemaps = []
          checked = 0
          for h, u in hash_lines:
              if checked >= 100:
                  print("Source-map fetch cap (100) reached")
                  break
              map_url = u + ".map"
              try:
                  req = urllib.request.Request(map_url, headers=INTIGRITI)
                  with urllib.request.urlopen(req, timeout=8) as r:
                      body = r.read(200_000).decode("utf-8", "ignore")
              except Exception:
                  time.sleep(0.15)
                  continue
              checked += 1
              time.sleep(0.15)
              if any(m in body for m in MAP_MARKERS):
                  sourcemaps.append(map_url)
                  for m in SECRET_RE.findall(body):
                      tok = m[0] if isinstance(m, tuple) else m
                      if tok:
                          with open("results/js_secrets_current.txt", "a") as sf:
                              sf.write(f"{map_url} | SOURCEMAP-{tok}\n")
              else:
                  # map-shaped but missing standard markers — still a live map
                  if body.strip().startswith("{") and '"version"' in body[:2000]:
                      sourcemaps.append(map_url)
          with open("results/js_sourcemaps_current.txt", "w") as out:
              out.write("\n".join(sorted(set(sourcemaps))) + ("\n" if sourcemaps else ""))
          print(f"[17a] Live source maps found: {len(set(sourcemaps))} (checked {checked})")

          # ---------- (c) bundle drift for previously-seen JS ----------
          prev = {}
          if os.path.exists("results/js_hashes_previous.txt"):
              for l in open("results/js_hashes_previous.txt"):
                  if "|" in l:
                      h, u = l.strip().split("|", 1)
                      prev.setdefault(u, h)
          changed = [u for h, u in hash_lines if u in prev and prev[u] != h]
          with open("results/js_bundle_changed.txt", "w") as out:
              out.write("\n".join(sorted(set(changed))) + ("\n" if changed else ""))
          print(f"[17c] JS bundles with changed content since last run: {len(set(changed))}")
          PYEOF

      - name: Diff JS source maps + bundle drift against previous run
        id: js_deep_diff
        run: |
          NEW_MAPS=$(grep -c '^http' results/js_sourcemaps_current.txt 2>/dev/null || echo 0)
          CHANGED=$(grep -c '^http' results/js_bundle_changed.txt 2>/dev/null || echo 0)
          echo "js_maps=$NEW_MAPS" >> "$GITHUB_OUTPUT"
          echo "js_ch=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Live source maps: $NEW_MAPS | Changed bundles: $CHANGED"

      - name: Diff JS secret findings against previous run
        id: js_diff
        run: |
          if [ -f results/js_secrets_previous.txt ]; then
            comm -13 results/js_secrets_previous.txt results/js_secrets_current.txt > results/js_secrets_new.txt
          else
            cp results/js_secrets_current.txt results/js_secrets_new.txt
          fi
          NEW_SECRETS=$(wc -l < results/js_secrets_new.txt | tr -d ' ')
          echo "new_secrets=$NEW_SECRETS" >> "$GITHUB_OUTPUT"

      - name: Notify Discord if new JS secrets found
        if: steps.js_diff.outputs.new_secrets != '0' || steps.js_deep_diff.outputs.js_maps != '0' || steps.js_deep_diff.outputs.js_ch != '0'
        run: |
          # [10] redaction: keep filename + first 12 chars of the match, then truncate
          # the rest so no full secret value leaves the runner. Full unredacted copy
          # stays in the workflow artifact for manual investigation.
          FINDINGS=$(head -n 60 results/js_secrets_new.txt | cut -c1-72 | paste -d'' - - /dev/null 2>/dev/null || true)
          FINDINGS=$(echo "$FINDINGS" | head -c 1500)
          MAPS=$(head -n 10 results/js_sourcemaps_current.txt | cut -c1-100)
          [ "$MAPS" = "" ] || MAPS=$'\n**Source maps exposed:**\n'"$MAPS"
          CHANGED=$(head -n 10 results/js_bundle_changed.txt | cut -c1-100)
          [ "$CHANGED" = "" ] || CHANGED=$'\n**Bundles changed (rescan flag):**\n'"$CHANGED"
          CONTENT=$(printf "**Possible secrets found in JS files (Citymesh) — REDACTED preview, verify manually in the artifact:**%s%s\n\`\`\`\n%s\n\`\`\`" "$MAPS" "$CHANGED" "$FINDINGS")
          PAYLOAD=$(jq -n --arg content "$CONTENT" '{content: $content}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Draft Intigriti report for top finding
        id: draft_report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_API_KEY_2: ${{ secrets.COHERE_API_KEY_2 }}
          COHERE_API_KEY_3: ${{ secrets.COHERE_API_KEY_3 }}
          INTIGRITI_H: ${{ secrets.INTIGRITI_USERNAME }}
          INTIGRITI_UA: 'Intigriti-VDP-Subdomain-Monitor'
        run: |
          # === [12] Intigriti report drafter ===
          # Assembles a copy-paste-ready submission matching the Citymesh RVDP form:
          # Title / Select asset / Endpoint / Severity + CVSS / PoC / Impact / Recommended solution.
          # Asset list and CWE taxonomy below mirror the program form (see scope reference).
          # Runs when there is report-worthy material, and always on manual draft_report dispatch.
          mkdir -p results

          FORCE_DRAFT="${{ inputs.draft_report }}"
          NUCLEI_NEW=$(head -n 8 results/nuclei_new.txt 2>/dev/null || true)
          BYPASS_NEW=$(head -n 5 results/bypass_new.txt 2>/dev/null || true)
          SECRETS_NEW=$(head -n 5 results/js_secrets_new.txt 2>/dev/null || true)
          HEADERS=$(cat results/findings_with_headers.txt 2>/dev/null | head -n 40 || true)

          if [ "$FORCE_DRAFT" != "true" ] && [ -z "$NUCLEI_NEW" ] && [ -z "$BYPASS_NEW" ] && [ -z "$SECRETS_NEW" ]; then
            echo "Nothing report-worthy this run (and no manual draft requested) — skipping report draft."
            echo "DRAFTED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          RUNNER_IP=$(curl -s --max-time 10 https://api.ipify.org)

          # --- in-scope asset table (asset|type) from the program form ---
          SCOPE_LIST=$(cat << 'ASSETS'
          212.71.0.0/24|IP Range
          212.71.1.0/24|IP Range
          212.71.2.0/24|IP Range
          212.71.3.0/24|IP Range
