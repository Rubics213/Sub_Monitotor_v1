          212.71.8.0/24|IP Range
          212.71.11.0/24|IP Range
          31.31.128.0/24|IP Range
          31.31.140.0/24|IP Range
          31.31.141.0/24|IP Range
          31.31.143.0/24|IP Range
          31.31.143.0/25|IP Range
          31.31.150.0/24|IP Range
          31.31.158.0/24|IP Range
          31.31.159.0/24|IP Range
          45.11.166.40/29|IP Range
          79.132.241.0/24|IP Range
          85.234.192.0/24|IP Range
          85.234.203.0/24|IP Range
          85.234.204.0/24|IP Range
          85.234.205.0/24|IP Range
          193.110.255.128/28|IP Range
          213.211.130.0/24|IP Range
          213.211.138.0/24|IP Range
          213.211.188.0/24|IP Range
          213.219.128.0/24|IP Range
          213.219.132.0/24|IP Range
          https://livechat.citymesh.com/|URL
          https://auth.citymesh.com/|URL
          https://extra.citymesh.com/|URL
          https://fleet.citymeshconnect.com/|URL
          https://my.citymesh.com/|URL
          https://cabmanager.citymesh.com/|URL
          https://dialhome.ncentric.be/|URL
          https://auth.wifilab.be/|URL
          https://extra.edpnet.net/|URL
          https://api-gateway.citymesh.com/|URL
          https://cc.safety-drones.com/|URL
          *.citymesh.com|Wildcard
          *.citymesh.net|Wildcard
          *.citymesh.be|Wildcard
          *.citymesh.eu|Wildcard
          *.citymesh.fr|Wildcard
          *.citymesh.nl|Wildcard
          *.citymesh.io|Wildcard
          *.citymesh.guide|Wildcard
          *.citymesh-connect.be|Wildcard
          *.citymesh-connect.com|Wildcard
          *.citymeshconnect.be|Wildcard
          *.citymeshconnect.com|Wildcard
          *.ctmsh.co|Wildcard
          *.edpnet.net|Wildcard
          *.edpnet.com|Wildcard
          *.edpnet.nl|Wildcard
          *.edpnet.be|Wildcard
          *.engiem2m.be|Wildcard
          *.engiem2m.com|Wildcard
          *.ncentric.be|Wildcard
          *.ncentric.cloud|Wildcard
          *.ncentric.com|Wildcard
          *.wifilab.be|Wildcard
          *.wflb.be|Wildcard
          *.gowifi.be|Wildcard
          *.myiot.be|Wildcard
          *.towereye.be|Wildcard
          *.towereye.eu|Wildcard
          *.safety-drones.be|Wildcard
          *.safety-drones.com|Wildcard
          *.safetydrones.be|Wildcard
          *.sigfox.nl|Wildcard
          *.ps-radiocom.be|Wildcard
          *.ps-radiocom.com|Wildcard
          *.ptxbac.be|Wildcard
          *.connectingsenses.be|Wildcard
          *.connectingsenses.com|Wildcard
          *.connectow.be|Wildcard
          *.connectow.eu|Wildcard
          *.antwerpfreewifi.be|Wildcard
          *.biotechnology-citymesh.com|Wildcard
          *.wifinmbssncb.be|Wildcard
          ASSETS
          )

          echo "$SCOPE_LIST" > results/in_scope_assets.txt

          # deterministic asset match: map evidence host/IP to likely in-scope entries
          python3 - << 'PYEOF'
          import re, ipaddress

          scope = [l.strip().split("|") for l in open("results/in_scope_assets.txt") if l.strip()]
          evidence = []
          for fn in ("results/nuclei_new.txt", "results/bypass_new.txt", "results/js_secrets_new.txt"):
              try:
                  evidence += open(fn).read().split()
              except FileNotFoundError:
                  pass
          hosts = set()
          for tok in evidence:
              m = re.match(r'https?://([^:/\s]+)', tok)
              if m:
                  hosts.add(m.group(1).lower())
              elif re.match(r'\d+\.\d+\.\d+\.\d+(/\d+)?$', tok):
                  hosts.add(tok)
          matches = []
          for host in sorted(hosts)[:6]:
              try:
                  ip = ipaddress.ip_address(host.split("/")[0])
                  for a, t in scope:
                      if t == "IP Range" and ip in ipaddress.ip_network(a, strict=False):
                          matches.append(f"{host} -> {a} ({t})")
                  continue
              except ValueError:
                  pass
              for a, t in scope:
                  dom = a.lstrip("*. ") if t == "Wildcard" else re.sub(r'https?://|/$', '', a)
                  if t == "Wildcard" and host.endswith("." + dom):
                      matches.append(f"{host} -> {a} ({t})")
                  elif t == "URL" and re.split(r'[:/]', host)[0] == dom:
                      matches.append(f"{host} -> {a} ({t})")
          open("results/asset_matches.txt", "w").write("\n".join(matches[:10]) or "(none)")
          PYEOF
          ASSET_MATCHES=$(cat results/asset_matches.txt 2>/dev/null)

          # deterministic candidate bundle for the AI/ skeleton
          CANDIDATES=$(printf "### nuclei findings (new):\n%s\n\n### 403 bypass results (new):\n%s\n\n### possible JS secrets (new):\n%s\n\n### captured response headers for findings:\n%s\n" \
            "${NUCLEI_NEW:-none}" "${BYPASS_NEW:-none}" "${SECRETS_NEW:-none}" "${HEADERS:-none}")

          # --- CWE taxonomy subset relevant to automated findings (form dropdown entries) ---
          TAXONOMY="Security Misconfiguration (Generic) (Misconfiguration); CWE-16 Misconfiguration (Misconfiguration); CWE-548 Information Exposure Through Directory Listing (Misconfiguration); CWE-209 Information Exposure Through an Error Message (Misconfiguration); CAPEC-291 DNS Zone Transfers (Misconfiguration); CWE-489 Leftover Debug Code (Backdoor) (Misconfiguration); CWE-287 Improper Authentication (Generic) (Broken Authentication); CWE-613 Insufficient Session Expiration (Broken Authentication); CWE-798 Use of Hard-coded Credentials (Broken Authentication); CWE-639 Insecure Direct Object Reference (Broken Access Control); CWE-285 Improper Authorization (Broken Access Control); CWE-22 Path Traversal (Broken Access Control); CWE-200 Information Disclosure (Access Control Issues); CWE-284 Improper Access Control (Access Control Issues); CWE-425 Forced Browsing (Access Control Issues); CWE-538 File and Directory Information Exposure (Access Control Issues); CWE-89 SQL Injection (Injection); CWE-78 OS Command Injection (Injection); CWE-94 Code Injection (Injection); CWE-96 Server-Side Template Injection (Injection); CWE-79 Reflected Cross-Site Scripting (Cross site scripting); CWE-79 Stored Cross-Site Scripting (Cross site scripting); CWE-79 DOM-Based Cross-Site Scripting (Cross site scripting); CWE-611 XML External Entity (XML External Entities); CWE-502 Deserialization of Untrusted Data (Insecure deserialisation); CWE-327 Use of a Broken or Risky Cryptographic Algorithm (Vulnerable components); CWE-295 Improper Certificate Validation (Cryptographic issues); CWE-918 Server-Side Request Forgery (Other); CWE-352 Cross-Site Request Forgery (Other); CWE-444 HTTP Request Smuggling (Other); CWE-601 Open Redirect (Other); CWE-400 Denial of Service (Other); Weak or Default Credentials (Other); CWE-203 Information Exposure Through Discrepancy ('Enumeration') (Other); Missing Cookie Flag (Other); No Rate Limiting (Other); Missing Security Header (Other); CRLF Injection (Other); Subdomain Takeover (Other); Web Cache Poisoning (Other); Web Cache Deception (Other); Host Header Injection (Other); CWE-434 Unrestricted file upload (Other); CWE-362 Race Condition (Other); LLM07:2025 System Prompt Leakage (Generative AI & LLMs); Sensitive Information Disclosure (Generative AI & LLMs)"

          PROMPT_TEXT=$(printf "You are drafting a submission for the Citymesh responsible-vulnerability-disclosure program (Intigriti RVDP, no bounty — points and reputation only). Below is scanner output from the latest automated run.\n\n%s\n\nLikely matching in-scope asset entries (deterministic match, verify before use):\n%s\n\nFull in-scope asset list (format 'asset|type'):\n%s\n\nINSTRUCTIONS: Draft the report. Use these exact section markers on their own lines: TITLE:, ASSET:, ASSET_TYPE:, CATEGORY:, SPECIFIC_TYPE:, SEVERITY:, CVSS:, POC:, IMPACT:, RECOMMENDED:\n- TITLE: max 100 chars, factual — no hedging like possible or potential.\n- ASSET: the single in-scope asset entry the finding belongs to — IP Range for IP findings, URL if on one of the listed URLs, Wildcard (*.domain) otherwise. Copy the entry verbatim.\n- ASSET_TYPE: IP Range | URL | Wildcard.\n- CATEGORY: one of the form's top-level types: Access Control Issues, Injection, Broken Authentication, XML External Entities, Broken Access Control, Misconfiguration, Cross site scripting, Insecure deserialisation, Vulnerable components, Cryptographic issues, Other.\n- SPECIFIC_TYPE: exactly one dropdown entry from this list that fits best: %s\n- SEVERITY: Low, Medium or High (no-bounty program; do not inflate).\n- CVSS: a plausible CVSS 4.0 vector starting with CVSS:4.0/.\n- POC: numbered repro steps drawn strictly from the automated evidence. State that all requests were sent with an Intigriti-identifying User-Agent and an X-Intigriti-Username header per RVDP rules.\n- IMPACT: 3-6 sentences, concrete and business-relevant.\n- RECOMMENDED: short, actionable fix list.\n- Keep POC under 2500 chars, IMPACT under 1200, RECOMMENDED under 900 (form limits are higher but concise reports review faster).\n- Do NOT invent vulnerabilities the evidence does not show. Draft only around what was observed.\n- Output ONLY the section markers with content, no preamble.\n\nSCANNER EVIDENCE:\n%s" "$CANDIDATES" "$ASSET_MATCHES" "$(echo "$SCOPE_LIST" | head -c 4800)" "$TAXONOMY")

          # fallback chain Gemini -> DeepSeek -> Cohere (same as other AI steps)
          SUMMARY=""
          for KEY_VAR in GEMINI_API_KEY GEMINI_API_KEY_2 GEMINI_API_KEY_3; do
            KEY_VAL="${!KEY_VAR:-}"
            [ -z "$KEY_VAL" ] && continue
            GEMINI_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" '{contents: [{parts: [{text: $text}]}]}')
            GEMINI_RESPONSE=$(curl -s -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=$KEY_VAL" \
              -H "Content-Type: application/json" -d "$GEMINI_PAYLOAD")
            SUMMARY=$(echo "$GEMINI_RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty' 2>/dev/null || echo "")
            if [ -n "$SUMMARY" ]; then PROVIDER="Gemini ($KEY_VAR)"; break; fi
          done
          if [ -z "$SUMMARY" ]; then
            if [ -n "$DEEPSEEK_API_KEY" ]; then
              DEEPSEEK_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" \
                '{model: "deepseek-flash", messages: [{role: "user", content: $text}]}')
              DEEPSEEK_RESPONSE=$(curl -s -X POST "https://api.deepseek.com/v1/chat/completions" \
                -H "Content-Type: application/json" -H "Authorization: Bearer $DEEPSEEK_API_KEY" -d "$DEEPSEEK_PAYLOAD")
              SUMMARY=$(echo "$DEEPSEEK_RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || echo "")
              if [ -n "$SUMMARY" ]; then PROVIDER="DeepSeek (deepseek-flash, tier-2)"; else echo "DeepSeek failed: $DEEPSEEK_RESPONSE"; fi
            fi
          fi
          if [ -z "$SUMMARY" ]; then
            for KEY_VAR in COHERE_API_KEY COHERE_API_KEY_2 COHERE_API_KEY_3; do
              KEY_VAL="${!KEY_VAR:-}"
              [ -z "$KEY_VAL" ] && continue
              COHERE_PAYLOAD=$(jq -n --arg text "$PROMPT_TEXT" \
                '{model: "command-a-03-2025", messages: [{role: "user", content: $text}]}')
              COHERE_RESPONSE=$(curl -s -X POST "https://api.cohere.com/v2/chat" \
                -H "Content-Type: application/json" -H "Authorization: Bearer $KEY_VAL" -d "$COHERE_PAYLOAD")
              SUMMARY=$(echo "$COHERE_RESPONSE" | jq -r '.message.content[0].text // empty' 2>/dev/null || echo "")
              if [ -n "$SUMMARY" ]; then PROVIDER="Cohere ($KEY_VAR, fallback)"; break; fi
            done
          fi

          DRAFT_PROVIDER="${PROVIDER:-deterministic template}"

          # merge into a final draft file; clamp to the form limits when present
          {
            echo "# Draft Intigriti submission — Citymesh RVDP"
            echo ""
            echo "> Drafted: $(date -u '+%Y-%m-%d %H:%M UTC') | Drafting provider: $DRAFT_PROVIDER"
            echo "> ALWAYS human-review before submitting. Do not submit AI-hallucinated steps unverified."
            echo ""
            echo "## Form: General -> Title"
            echo "$SUMMARY" | sed -n 's/^TITLE:[[:space:]]*//p' | head -n 1
            echo ""
            echo "## Form: Select asset (tier/type)"
            echo "$SUMMARY" | sed -n 's/^ASSET:[[:space:]]*//p' | head -n 1
            echo "$SUMMARY" | sed -n 's/^ASSET_TYPE:[[:space:]]*//p' | head -n 1
            echo ""
            echo "## Form: Endpoint / vulnerable component"
            echo "Category: $(echo "$SUMMARY" | sed -n 's/^CATEGORY:[[:space:]]*//p' | head -n 1)"
            echo "Specific type (dropdown entry): $(echo "$SUMMARY" | sed -n 's/^SPECIFIC_TYPE:[[:space:]]*//p' | head -n 1)"
            echo ""
            echo "## Form: Severity"
            echo "Suggested severity: $(echo "$SUMMARY" | sed -n 's/^SEVERITY:[[:space:]]*//p' | head -n 1)"
            echo "Suggested CVSS 4.0 vector: $(echo "$SUMMARY" | sed -n 's/^CVSS:[[:space:]]*//p' | head -n 1)"
            echo ""
            echo "## Form: Details -> Proof of Concept / description"
            echo "$SUMMARY" | sed -n '/^POC:/,/^IMPACT:/p' | sed '/^IMPACT:/d; s/^POC:[[:space:]]*//' | head -c 29000
            echo ""
            echo "## Form: Details -> Impact"
            echo "$SUMMARY" | sed -n '/^IMPACT:/,/^RECOMMENDED:/p' | sed '/^RECOMMENDED:/d; s/^IMPACT:[[:space:]]*//' | head -c 14000
            echo ""
            echo "## Form: Details -> Recommended solution"
            echo "$SUMMARY" | sed -n '/^RECOMMENDED:/,$p' | sed 's/^RECOMMENDED:[[:space:]]*//' | head -c 14000
            echo ""
            echo "## Form: IP address used for testing"
            echo "$RUNNER_IP"
            echo ""
            echo "---"
            echo "### Raw evidence (for attachments, unredacted, stays in the workflow artifact) —"
            echo '```'
            echo "$CANDIDATES" | head -c 6000
            echo '```'
          } > results/draft_intigriti_report.md

          if [ -z "$SUMMARY" ]; then
            echo "AI drafting unavailable — deterministic skeleton written instead."
          fi
          echo "DRAFTED=true" >> "$GITHUB_ENV"
          echo "Report draft written to results/draft_intigriti_report.md (provider: $DRAFT_PROVIDER)"

      - name: Update previous results
        run: |
          cp results/current.txt results/previous.txt
          cp results/current_alive.txt results/previous_alive.txt
          cp results/current_alive_hosts.txt results/previous_alive_hosts.txt
          cp results/nuclei_current.txt results/nuclei_previous.txt
          cp results/ffuf_current.txt results/ffuf_previous.txt
          cp results/bypass_current.txt results/bypass_previous.txt
          cp results/js_secrets_current.txt results/js_secrets_previous.txt
          cp results/js_hashes_current.txt results/js_hashes_previous.txt
          cp -f results/fuzz_log.json results/fuzz_log_last_run.json 2>/dev/null || true

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/previous.txt results/previous_alive.txt results/previous_alive_hosts.txt results/nuclei_previous.txt results/ffuf_previous.txt results/bypass_previous.txt results/js_secrets_previous.txt results/js_hashes_previous.txt results/fuzz_log.json
          git diff --cached --quiet || git commit -m "Update baselines [skip ci]"
          git push

      - name: Write job summary
        if: always()
        run: |
          TOTAL_SUBS=$(wc -l < results/current.txt 2>/dev/null | tr -d ' ' || echo 0)
          ALIVE_SUBS=$(wc -l < results/current_alive_hosts.txt 2>/dev/null | tr -d ' ' || echo 0)
          NEW_SUBS=$(wc -l < results/new_hosts.txt 2>/dev/null | tr -d ' ' || echo 0)
          TOTAL_NUCLEI=$(wc -l < results/nuclei_current.txt 2>/dev/null | tr -d ' ' || echo 0)
          NEW_NUCLEI=$(wc -l < results/nuclei_new.txt 2>/dev/null | tr -d ' ' || echo 0)
          FUZZED_HOSTS=$(wc -l < results/ffuf_targets.txt 2>/dev/null | tr -d ' ' || echo 0)
          TOTAL_PATHS=$(wc -l < results/ffuf_current.txt 2>/dev/null | tr -d ' ' || echo 0)
          NEW_PATHS=$(wc -l < results/ffuf_new.txt 2>/dev/null | tr -d ' ' || echo 0)
          TOTAL_BYPASSES=$(wc -l < results/bypass_current.txt 2>/dev/null | tr -d ' ' || echo 0)
          NEW_BYPASSES=$(wc -l < results/bypass_new.txt 2>/dev/null | tr -d ' ' || echo 0)
          JS_FILES_SCANNED=$(wc -l < results/js_urls_current.txt 2>/dev/null | tr -d ' ' || echo 0)
          TOTAL_SECRETS=$(wc -l < results/js_secrets_current.txt 2>/dev/null | tr -d ' ' || echo 0)
          NEW_SECRETS=$(wc -l < results/js_secrets_new.txt 2>/dev/null | tr -d ' ' || echo 0)
          FULL_HEADERS_LINES=$(wc -l < results/findings_with_headers_full.txt 2>/dev/null | tr -d ' ' || echo 0)
          PRIORITIZED="${{ steps.prioritize.outputs.prioritized }}"

          {
            echo "## Citymesh Monitor — Run Summary"
            echo ""
            echo "Run time: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Stage | Total | New this run |"
            echo "|---|---|---|"
            echo "| Subdomains found | $TOTAL_SUBS | — |"
            echo "| Live hosts | $ALIVE_SUBS | $NEW_SUBS |"
            echo "| Nuclei findings | $TOTAL_NUCLEI | $NEW_NUCLEI |"
            echo "| Hosts fuzzed ($FUZZED_HOSTS/$ALIVE_SUBS, AI-prioritized: $PRIORITIZED) | — | — |"
            echo "| Directory paths | $TOTAL_PATHS | $NEW_PATHS |"
            echo "| 403 bypasses | $TOTAL_BYPASSES | $NEW_BYPASSES |"
            echo "| JS files scanned | $JS_FILES_SCANNED | — |"
            echo "| Possible JS secrets | $TOTAL_SECRETS | $NEW_SECRETS |"
            echo "| Full-backlog header lines (weekly / manual test) | $FULL_HEADERS_LINES | — |"
            echo ""
            if [ "$NEW_SUBS" = "0" ] && [ "$NEW_NUCLEI" = "0" ] && [ "$NEW_PATHS" = "0" ] && [ "$NEW_BYPASSES" = "0" ] && [ "$NEW_SECRETS" = "0" ]; then
              echo "No new findings this run — baseline unchanged."
            else
              echo "New findings this run — check Discord for details, or the \`results/\` artifacts below."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full results as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: |
            results/
          retention-days: 14

      - name: Verify Intigriti headers configured
        run: |
          if [ -z "$INTIGRITI_H" ]; then
            echo "::warning::INTIGRITI_USERNAME secret is NOT set — program-required X-Intigriti-Username header is empty. Set the repo secret before real runs."
          else
            echo "Intigriti header configured: X-Intigriti-Username set (handle redacted)."
          fi
